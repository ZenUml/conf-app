name: Deploy Agent Link Worker (Staging)

# Isolated from staging-deploy.yml / build-test-deploy.yml on purpose: this
# workflow deploys ONLY the standalone `conf-agent-link` companion Worker
# (workers/agent-link/) that hosts the AgentLinkSession Durable Object. It
# must not share a trigger, job, or concurrency group with the Forge/Pages
# pipeline so a Worker-only change can't affect (or be blocked by) the main
# app deploy, and vice versa.
on:
  push:
    # Release tags (v2026.08.31xxxx-lite, ...) point at the released commit, so a
    # tag push redeployed this Worker to STAGING from whatever tree that tag
    # carries — 18 of the 20 runs before 2026-09-01 were tag-triggered. Harmless
    # while agent-link is unchanged, but a tag cut before an agent-link change
    # silently rolls staging back, which is exactly the deploy-order failure the
    # contract below describes. Mirrors build-test-deploy.yml's tags-ignore.
    tags-ignore:
      - '**'
    paths:
      - 'workers/agent-link/**'
      # The DO class lives in functions/agent-link/ (re-exported by the Worker's
      # src/index.ts), so DO source changes must also redeploy the Worker.
      - 'functions/agent-link/**'
      - '.github/workflows/agent-link-worker-deploy.yml'
  workflow_dispatch: {}

# Staging only. Production deploy for this Worker stays a separate,
# human-gated step (pnpm --filter agent-link deploy:prod) — not automated here.
#
# DEPLOY-ORDER CONTRACT: this Worker hosts the AgentLinkSession DO, whose
# claimContentLockAtCap re-claims the per-contentId content lock to the 60-min
# cap. The Pages Function functions/agent-link/session.ts now mints that lock at
# only 10 min and RELIES on this DO to extend it (spec §4.3, amended 2026-07-16).
# Pages auto-promotes to prod with the normal app release; this Worker does not.
# So a prod app release carrying mint-at-idle while THIS Worker still runs a
# pre-amendment DO lets the lock lapse mid-session and a second mint win the gap
# (two live sessions on one diagram — design §7 decision #2). Run this Worker's
# prod deploy BEFORE or WITH any such app release. See spec §4.2 "Deploy order".
concurrency:
  group: agent-link-worker-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-worker:
    name: Deploy conf-agent-link-stg
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies (skip post-install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Deploy conf-agent-link to staging
        run: npx wrangler deploy --env stg
        working-directory: workers/agent-link
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
