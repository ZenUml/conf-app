name: Build, Test and Draft Release

on:
  push:
    tags-ignore:
      - '**' # do not run on tags
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.cursor/**'
      # GitHub PR Agent Panel: a local Chrome extension and Hub, not part of the Confluence app.
      - 'packages/pr-agent-panel/**'
      - 'workers/render-mcp/**'
      - '.github/workflows/render-mcp-deploy.yml'
      - 'scripts/ci/check-render-mcp.mjs'
      - 'scripts/ci/wait-for-render-mcp*'
  # Allows the release workflow to create fresh, tested drafts without a
  # no-op commit to main.
  workflow_dispatch:
    inputs:
      full-tests:
        type: boolean
        default: false
        description: Run complete regression and render suites for all four staging variants
      bypass-regression-gate:
        type: boolean
        default: false
        description: Allow drafts once despite the daily regression gate; staging tests remain mandatory
      bypass-reason:
        type: string
        default: ''
        description: Required explanation when bypassing the daily regression gate

# Shared environment ownership spans every staging deployment and test in this run.
# The phases are called workflows, so they hold it as part of this run.
concurrency:
  group: conf-app-staging
  cancel-in-progress: false
  queue: max

jobs:
  version:
    name: Source and version
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      version: ${{ steps.v.outputs.version }}
      source-sha: ${{ steps.v.outputs.source-sha }}
    steps:
      - id: v
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          echo "version=$(TZ=Australia/Brisbane date +'%Y.%m.%d%H%M')" >> "$GITHUB_OUTPUT"
          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Record root options for this source and attempt
        env:
          FULL_TESTS: ${{ inputs.full-tests || false }}
          BYPASS_REGRESSION_GATE: ${{ inputs.bypass-regression-gate || false }}
          BYPASS_REASON: ${{ inputs.bypass-reason || '' }}
        run: node scripts/ci/wait-for-e2e.mjs --record-root-options
      - uses: actions/upload-artifact@v6
        with:
          name: main-root-options-${{ github.run_attempt }}
          path: main-root-options.json
          if-no-files-found: error
          retention-days: 30

  # The three phases are called workflows, so their jobs run inside this root
  # run: no dispatch, no polling, and one run page holds the whole pipeline.
  build-preparation:
    name: Build preparation
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/main-build-preparation.yml
    with:
      source-sha: ${{ needs.version.outputs.source-sha }}
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  staging-validation:
    name: Staging validation
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/main-staging-validation.yml
    with:
      source-sha: ${{ needs.version.outputs.source-sha }}
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # Runs after a failed build or staging phase too: the drafts of the variants
  # that passed still get created.
  draft-preparation:
    name: Draft preparation
    needs: [version, build-preparation, staging-validation]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.build-preparation.result == 'success' || needs.build-preparation.result == 'failure') && (needs.staging-validation.result == 'success' || needs.staging-validation.result == 'failure') }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
      repository-projects: write
    uses: ./.github/workflows/main-draft-preparation.yml
    with:
      source-sha: ${{ needs.version.outputs.source-sha }}
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  outcome:
    name: Pipeline outcome
    needs: [version, build-preparation, staging-validation, draft-preparation]
    if: ${{ always() && needs.version.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.source-sha }}
      - name: Report verified daily draft gate
        if: ${{ always() && (needs.draft-preparation.result == 'success' || needs.draft-preparation.result == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.version.outputs.source-sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, appendFileSync, mkdtempSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { verifyDailyGate } from './scripts/ci/wait-for-e2e.mjs';
          const env = process.env;
          const directory = mkdtempSync(join(tmpdir(), 'daily-gate-'));
          execFileSync('gh', ['run', 'download', env.GITHUB_RUN_ID, '--repo', env.GITHUB_REPOSITORY, '--name', `daily-gate-${env.GITHUB_RUN_ATTEMPT}`, '--dir', directory]);
          const gate = verifyDailyGate(JSON.parse(readFileSync(join(directory, 'daily-gate.json'), 'utf8')), env.GITHUB_RUN_ID, env.GITHUB_RUN_ATTEMPT, env.SOURCE_SHA);
          appendFileSync(env.GITHUB_STEP_SUMMARY, `### Daily release draft gate: ${gate.allowed === 'true' ? 'allowed' : 'blocked'}\n\n${gate['gate-reason']}\n\nDaily regression: ${gate['regression-run-url'] || 'no verified run'}\n\nBypass reason: ${gate.bypass_reason || 'none'}\n\nTo refresh: Actions → Daily Full Staging Regression → Run workflow → main, leave SHA empty or enter this source SHA. Wait for success, then rerun the root.\n\nTo bypass once: Actions → Build, Test and Draft Release → Run workflow → main → enable bypass-regression-gate → enter bypass-reason → Run workflow. Staging tests remain mandatory.\n`);
          NODE

      - name: Require successful phases
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const results = JSON.parse(process.env.RESULTS);
          if (Object.values(results).some(value => value.result !== 'success')) process.exitCode = 1;
          NODE
