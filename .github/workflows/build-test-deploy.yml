name: Build, Test and Draft Release

on:
  push:
    tags-ignore:
      - '**' # do not run on tags
    branches:
      - '**'
      - '!**ruixiang-e2e**'
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'docs/**'
      - '.claude/**'
      - '.cursor/**'
  # pull_request events let us gate E2E on PR draft state. The pull_request
  # synchronize event also fires on every push to a PR branch — concurrency
  # below dedupes it against the matching push event.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'docs/**'
      - '.claude/**'
      - '.cursor/**'

# Cancel superseded runs on the same branch. The default branch never cancels
# so release drafts are never lost mid-flight. `head_ref` is the source branch on
# pull_request events; `ref_name` is the short branch name on push events.
# Both resolve to the bare branch name, so push + pull_request synchronize
# events on the same branch share one concurrency group (deduplicated).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: Build and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # Skip submodules at checkout — `submodules: recursive` tries to clone
        # the `private` submodule (ZenUml/conf-app-private) which the default
        # GITHUB_TOKEN cannot access ("Repository not found"), aborting checkout
        # before the build runs. The asyncapi build needs vendor/asyncapi-studio
        # only — initialise it explicitly below.
      - name: Init asyncapi-studio submodule
        run: git submodule update --init --depth 1 vendor/asyncapi-studio
      # Capture the submodule SHA so the cache key changes only when the
      # studio pin moves — every PR that doesn't bump vendor/asyncapi-studio
      # reuses the previous build artifacts.
      - name: Resolve asyncapi-studio submodule SHA
        id: studio-sha
        run: echo "sha=$(git -C vendor/asyncapi-studio rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Cache Studio build output + its node_modules. On a cache hit:
      #   - static/asyncapi-studio/.studio-commit already matches the pin,
      #     so scripts/build-studio.sh fast-paths out (no pnpm install,
      #     no Next.js build) — saves ~60–90s per CI run.
      #   - vendor/asyncapi-studio/node_modules being restored means a
      #     forced rebuild (FORCE_REBUILD=1) is also cheap because pnpm
      #     install in the submodule short-circuits.
      # Cache key includes scripts/build-studio.sh hash so changes to the
      # build logic invalidate the cache. The fallback restore-keys lets
      # us still pull node_modules even if the submodule SHA moved (saves
      # most of the pnpm install on pin bumps).
      - name: Cache asyncapi Studio build
        uses: actions/cache@v4
        with:
          path: |
            static/asyncapi-studio
            vendor/asyncapi-studio/node_modules
            vendor/asyncapi-studio/apps/*/node_modules
            vendor/asyncapi-studio/packages/*/node_modules
          key: studio-${{ steps.studio-sha.outputs.sha }}-${{ hashFiles('scripts/build-studio.sh') }}
          restore-keys: |
            studio-${{ steps.studio-sha.outputs.sha }}-
            studio-
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.x
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies (skip post-install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
      - run: pnpm test:unit
      # Verify the asyncapi variant builds even on feature-branch PRs. The
      # staging-asyncapi job below only runs on the default branch (like
      # full/diagramly), so this is the smoke test for PRs.
      # The Cache step above usually makes this near-instant (vite build only).
      - name: Verify asyncapi build
        run: pnpm build:asyncapi
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          # Skip Puppeteer's chromium download inside the Studio submodule's
          # pnpm install (some transitive deps pull it in but the Studio
          # build doesn't need it).
          PUPPETEER_SKIP_DOWNLOAD: "true"
  
  staging-lite:
    name: "Deploy: Lite"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      variant: lite
      license: lite
      project: conf-stg-lite
      environment: staging-lite
    secrets: inherit

  staging-lite-e2e:
    # Dispatch E2E to the public repo runner only when it actually matters:
    #   - on the default branch (post-merge / scheduled coverage), or
    #   - on a PR that is Ready for Review (signals "I want this merged").
    # Pushing to a Draft PR (or to a branch with no PR open) deploys but
    # skips E2E so iterative work isn't gated on a slow test run.
    if: |
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    needs: [staging-lite, build]
    name: "E2E: Lite"
    uses: ./.github/workflows/e2e-test.yml
    with:
      app: zenuml-lite@stg
      suite: insert
      artifact-suffix: lite-stg
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  staging-full:
    # Lite is representative for feature-branch validation. Full + Diagramly
    # only run on the default branch to catch variant-specific regressions before release;
    # this halves the per-push minutes on feature branches.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: "Deploy: Full"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      variant: full
      license: full
      project: conf-stg-full
      environment: staging-full
    secrets: inherit

  staging-full-e2e:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [staging-full, build]
    name: "E2E: Full"
    uses: ./.github/workflows/e2e-test.yml
    with:
      app: zenuml-full@stg
      suite: insert
      artifact-suffix: full-stg
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  staging-diagramly:
    # See note on staging-full — default-branch-only.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: "Deploy: Diagramly"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      variant: diagramly
      license: diagramly
      project: conf-stg-lite
      environment: staging-diagramly
    secrets: inherit

  staging-asyncapi:
    # Default-branch-only after asyncapi lands on main (matches staging-full /
    # staging-diagramly). While the asyncapi feature work is still on its own
    # PR branch (claude/asyncapi-pr3-viewer-save), also fire there so the team
    # can validate end-to-end against asyncapi-stg.atlassian.net before merge.
    # Drop the second clause once this PR merges to main.
    #
    # On a `pull_request` event `github.ref` is `refs/pull/<N>/merge`, so the
    # branch comparison only works against `github.head_ref` (set on PR
    # events) — `github.ref_name` covers the push event variant. Mirrors the
    # workflow's own concurrency group which uses the same `head_ref ||
    # ref_name` idiom.
    #
    # AsyncAPI shares the lite Cloudflare Pages project for now (per
    # scripts/forge-wizard.mjs); swap to a dedicated `conf-stg-asyncapi`
    # project when one is stood up.
    if: |
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      github.head_ref == 'claude/asyncapi-pr3-viewer-save' ||
      github.ref_name == 'claude/asyncapi-pr3-viewer-save'
    name: "Deploy: AsyncAPI"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      variant: asyncapi
      license: asyncapi
      project: conf-stg-lite
      environment: staging-asyncapi
    secrets: inherit

  staging-asyncapi-e2e:
    # Mirror the staging-asyncapi gate so the e2e runs whenever a fresh build
    # is deployed. See the note on staging-asyncapi for why we need
    # head_ref/ref_name (pull_request vs push event). Skips on draft PRs
    # (matches staging-lite-e2e behaviour).
    if: |
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       github.head_ref == 'claude/asyncapi-pr3-viewer-save' ||
       github.ref_name == 'claude/asyncapi-pr3-viewer-save')
      && !(github.event_name == 'pull_request' && github.event.pull_request.draft == true)
    needs: [staging-asyncapi, build]
    name: "E2E: AsyncAPI"
    uses: ./.github/workflows/e2e-test.yml
    with:
      app: asyncapi@stg
      suite: asyncapi
      artifact-suffix: asyncapi-stg
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  staging-diagramly-e2e:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [staging-diagramly, build]
    name: "E2E: Diagramly"
    uses: ./.github/workflows/e2e-test.yml
    with:
      app: diagramly@stg
      suite: insert
      artifact-suffix: diagramly-stg
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  draft-release-lite:
    name: "Draft: Lite"
    # don't run on pull requests to avoid creating draft releases for pull requests
    # only run on the default branch, to avoid cutting releases from feature branches
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [staging-lite-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v5

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          VERSION="$(echo $(date +'%Y.%m.%d%H%M'))"
          echo "version=$VERSION" >> $GITHUB_ENV

      # Create new release draft - which is not publicly visible and requires manual acceptance
      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-lite
          name: v${{ env.version }}-lite
          body: 'This is a draft release for the Lite version of the plugin.'
          draft: true

  draft-release-full:
    name: "Draft: Full"
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [staging-full-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v5

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          VERSION="$(echo $(date +'%Y.%m.%d%H%M'))"
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-full
          name: v${{ env.version }}-full
          body: 'This is a draft release for the Full version of the plugin.'
          draft: true

  draft-release-diagramly:
    name: "Draft: Diagramly"
    # don't run on pull requests to avoid creating draft releases for pull requests
    # only run on the default branch, to avoid cutting releases from feature branches
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [staging-diagramly-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v5

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          VERSION="$(echo $(date +'%Y.%m.%d%H%M'))"
          echo "version=$VERSION" >> $GITHUB_ENV

      # Create new release draft - which is not publicly visible and requires manual acceptance
      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-diagramly
          name: v${{ env.version }}-diagramly
          body: 'This is a draft release for the Diagramly version of the plugin.'
          draft: true

  draft-release-asyncapi:
    name: "Draft: AsyncAPI"
    # Mirrors the lite/full/diagramly drafts. Production release.yml does not
    # yet handle the `asyncapi` variant — when it does, an `asyncapi` tag
    # published from this draft will trigger the prod deploy automatically.
    # Until then the draft is a no-op artifact (intentional: keeps the
    # release cadence aligned across variants).
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [staging-asyncapi-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v5

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          VERSION="$(echo $(date +'%Y.%m.%d%H%M'))"
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-asyncapi
          name: v${{ env.version }}-asyncapi
          body: 'This is a draft release for the AsyncAPI variant of the plugin.'
          draft: true

  deploy-cron-worker:
    name: "Cron: Deploy"
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.x
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter cron-aggregate
      - name: Deploy cron-aggregate to staging
        working-directory: workers/cron-aggregate
        run: npx wrangler deploy --env stg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
