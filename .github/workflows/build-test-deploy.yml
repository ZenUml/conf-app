name: Build, Test and Draft Release

on:
  push:
    tags-ignore:
      - '**' # do not run on tags
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.cursor/**'
  # Allows the release workflow to create fresh, tested drafts without a
  # no-op commit to main.
  workflow_dispatch:

# Shared environment ownership spans every staging deployment and test in this run.
# Dispatched phases inherit ownership while this root waits for their completion.
concurrency:
  group: conf-app-staging
  cancel-in-progress: false
  queue: max

jobs:
  version:
    name: Source and version
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      version: ${{ steps.v.outputs.version }}
      source-sha: ${{ steps.v.outputs.source-sha }}
    steps:
      - id: v
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          echo "version=$(TZ=Australia/Brisbane date +'%Y.%m.%d%H%M')" >> "$GITHUB_OUTPUT"
          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build-preparation:
    name: Build preparation
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
    outputs:
      run-id: ${{ steps.dispatch.outputs.run-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.source-sha }}
      - name: Dispatch and wait for phase
        id: dispatch
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_KIND: phase
          CHILD_WORKFLOW: main-build-preparation.yml
          CHILD_TITLE: Build preparation
          SOURCE_SHA: ${{ needs.version.outputs.source-sha }}
          VERSION: ${{ needs.version.outputs.version }}
          WAIT_MINUTES: '60'
        run: node scripts/ci/wait-for-e2e.mjs
      - name: Close any active phase
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: main-build-preparation.yml
          CHILD_TITLE: Build preparation
          SOURCE_SHA: ${{ needs.version.outputs.source-sha }}
        run: node scripts/ci/wait-for-e2e.mjs --cleanup

  staging-validation:
    name: Staging validation
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
    outputs:
      run-id: ${{ steps.dispatch.outputs.run-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.source-sha }}
      - name: Dispatch and wait for phase
        id: dispatch
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_KIND: phase
          CHILD_WORKFLOW: main-staging-validation.yml
          CHILD_TITLE: Staging validation
          SOURCE_SHA: ${{ needs.version.outputs.source-sha }}
          VERSION: ${{ needs.version.outputs.version }}
          WAIT_MINUTES: '60'
        run: node scripts/ci/wait-for-e2e.mjs
      - name: Close any active phase
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: main-staging-validation.yml
          CHILD_TITLE: Staging validation
          SOURCE_SHA: ${{ needs.version.outputs.source-sha }}
        run: node scripts/ci/wait-for-e2e.mjs --cleanup

  draft-preparation:
    name: Draft preparation
    needs: [version, build-preparation, staging-validation]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.build-preparation.outputs.run-id != '' && (needs.build-preparation.result == 'success' || needs.build-preparation.result == 'failure') && needs.staging-validation.outputs.run-id != '' && (needs.staging-validation.result == 'success' || needs.staging-validation.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
    outputs:
      run-id: ${{ steps.dispatch.outputs.run-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.source-sha }}
      - name: Dispatch and wait for phase
        id: dispatch
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_KIND: phase
          CHILD_WORKFLOW: main-draft-preparation.yml
          CHILD_TITLE: Draft preparation
          SOURCE_SHA: ${{ needs.version.outputs.source-sha }}
          VERSION: ${{ needs.version.outputs.version }}
          WAIT_MINUTES: '60'
          ARTIFACT_RUN_ID: ${{ needs.build-preparation.outputs.run-id }}
          STAGING_RUN_ID: ${{ needs.staging-validation.outputs.run-id }}
        run: node scripts/ci/wait-for-e2e.mjs
      - name: Close any active phase
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: main-draft-preparation.yml
          CHILD_TITLE: Draft preparation
          SOURCE_SHA: ${{ needs.version.outputs.source-sha }}
        run: node scripts/ci/wait-for-e2e.mjs --cleanup

  outcome:
    name: Pipeline outcome
    needs: [version, build-preparation, staging-validation, draft-preparation]
    if: ${{ always() && needs.version.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful phases
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const results = JSON.parse(process.env.RESULTS);
          if (Object.values(results).some(value => value.result !== 'success')) process.exitCode = 1;
          NODE
