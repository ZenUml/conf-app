name: Build, Test and Draft Release

on:
  push:
    tags-ignore:
      - '**' # do not run on tags
    branches:
      - '**'
      - '!**ruixiang-e2e**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.cursor/**'
  # pull_request events let us gate E2E on PR draft state. The pull_request
  # synchronize event also fires on every push to a PR branch — concurrency
  # below dedupes it against the matching push event.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.cursor/**'
  # Allows the release workflow to create fresh, tested drafts without a
  # no-op commit to main.
  workflow_dispatch:

# Cancel superseded runs on the same branch. The default branch never cancels
# so release drafts are never lost mid-flight. `head_ref` is the source branch on
# pull_request events; `ref_name` is the short branch name on push events.
# Both resolve to the bare branch name, so push + pull_request synchronize
# events on the same branch share one concurrency group (deduplicated).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # Skip submodules at checkout — `submodules: recursive` tries to clone
        # the `private` submodule (ZenUml/conf-app-private) which the default
        # GITHUB_TOKEN cannot access ("Repository not found"), aborting checkout
        # before the build runs. The asyncapi build needs vendor/asyncapi-studio
        # only — initialise it explicitly below.
      - name: Init asyncapi-studio submodule
        run: git submodule update --init --depth 1 vendor/asyncapi-studio
      # Capture the submodule SHA so the cache key changes only when the
      # studio pin moves — every PR that doesn't bump vendor/asyncapi-studio
      # reuses the previous build artifacts.
      - name: Resolve asyncapi-studio submodule SHA
        id: studio-sha
        run: echo "sha=$(git -C vendor/asyncapi-studio rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Cache Studio build output + its node_modules. On a cache hit:
      #   - static/asyncapi-studio/.studio-commit already matches the pin,
      #     so scripts/build-studio.sh fast-paths out (no pnpm install,
      #     no Next.js build) — saves ~60–90s per CI run.
      #   - vendor/asyncapi-studio/node_modules being restored means a
      #     forced rebuild (FORCE_REBUILD=1) is also cheap because pnpm
      #     install in the submodule short-circuits.
      # Cache key includes scripts/build-studio.sh hash so changes to the
      # build logic invalidate the cache. The fallback restore-keys lets
      # us still pull node_modules even if the submodule SHA moved (saves
      # most of the pnpm install on pin bumps).
      - name: Cache asyncapi Studio build
        uses: actions/cache@v5
        with:
          path: |
            static/asyncapi-studio
            vendor/asyncapi-studio/node_modules
            vendor/asyncapi-studio/apps/*/node_modules
            vendor/asyncapi-studio/packages/*/node_modules
          key: studio-${{ steps.studio-sha.outputs.sha }}-${{ hashFiles('scripts/build-studio.sh') }}
          restore-keys: |
            studio-${{ steps.studio-sha.outputs.sha }}-
            studio-
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies (skip post-install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
      - run: pnpm test:unit
      # Verify the asyncapi variant builds even on feature-branch PRs. The
      # staging-asyncapi job below only runs on the default branch (like
      # full/diagramly), so this is the smoke test for PRs.
      # The Cache step above usually makes this near-instant (vite build only).
      - name: Verify asyncapi build
        run: pnpm build:asyncapi
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          # Skip Puppeteer's chromium download inside the Studio submodule's
          # pnpm install (some transitive deps pull it in but the Studio
          # build doesn't need it).
          PUPPETEER_SKIP_DOWNLOAD: "true"
  
  preview-e2e:
    # The one E2E project that needs no Confluence site, no Forge app and no
    # OTP: the viewer/editor preview specs drive a local Vite dev server, so
    # they cost a runner and nothing else. That makes this the cheapest real
    # gate in the pipeline, which is why — unlike the staging suites below — it
    # runs on EVERY push, drafts included. Before this job the `preview` project
    # was collected but never gated: it only ran when someone remembered to
    # start Vite and run it by hand.
    name: "E2E: Viewer preview"
    runs-on: ubuntu-latest
    # Generous next to a ~2 min expectation: the whole point of this job is to
    # be cheap and quiet, so give a cold pnpm store room rather than reap it.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      # Deliberately NO asyncapi-studio submodule init. vite.config only copies
      # the Studio when `command === 'build'`, and mermaid is served in dev by
      # an in-config middleware straight out of node_modules, so `vite dev`
      # needs neither. Skipping it is most of what keeps this job cheap.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
      - name: Install E2E test dependencies
        run: cd tests/e2e-tests && pnpm install --ignore-workspace
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('tests/e2e-tests/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: cd tests/e2e-tests && pnpm exec playwright install --with-deps chromium
      - name: Run preview specs against a local Vite dev server
        # Server and tests share ONE step so the server cannot outlive or
        # predecease them: a background process started in an earlier step is
        # not guaranteed to survive into the next one, and a dead server turns
        # into six confusing connection failures rather than one clear error.
        #
        # `pnpm start:local` is not used here because it wraps vite in portless,
        # which allocates a dynamic hostname CI has no route for. Calling vite
        # directly with PORT set also flips vite's `strictPort`, so a busy port
        # fails loudly instead of quietly serving the specs a different app.
        #
        # LOCAL_DEV_URL short-circuits helpers/localDevUrl.ts, which otherwise
        # shells out to `pnpm dev:url` (portless again) to discover the base URL.
        run: |
          PORT=8080 HOST=127.0.0.1 VERSION=latest PRODUCT_TYPE=lite \
            pnpm exec vite dev > /tmp/vite-dev.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/viewer-preview.html && break
            if [ "$i" -eq 60 ]; then
              echo "Vite dev server never became reachable. Its log:"
              cat /tmp/vite-dev.log
              exit 1
            fi
            sleep 2
          done
          cd tests/e2e-tests && pnpm exec playwright test --project=preview
        env:
          CI: true
          LOCAL_DEV_URL: http://127.0.0.1:8080
      - name: Upload the dev server log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: preview-vite-dev-log
          path: /tmp/vite-dev.log
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-preview
          path: ./tests/e2e-tests/blob-report/
          if-no-files-found: ignore

  staging-lite:
    name: "Deploy: Lite"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      variant: lite
      license: lite
      project: conf-stg-lite
      environment: staging-lite
    secrets: inherit

  staging-lite-e2e:
    # Dispatch E2E to the public repo runner only when it actually matters:
    #   - on the default branch (post-merge / scheduled coverage), or
    #   - on a PR that is Ready for Review (signals "I want this merged").
    # Pushing to a Draft PR (or to a branch with no PR open) deploys but
    # skips E2E so iterative work isn't gated on a slow test run.
    if: |
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    needs: [staging-lite, build]
    name: "E2E: Lite"
    uses: ./.github/workflows/e2e-test.yml
    with:
      app: zenuml-lite@stg
      suite: insert
      # Above the 8-minute default because shard 1 carries every `byline-*` spec
      # (`--shard` splits contiguously by file name — see the note in
      # e2e-test.yml). Measured on this job: 3m36s at 6 tests, 5m35s at 8 after
      # byline-asyncapi landed there. At `retries: 2` a single retry of the
      # byline create test costs ~2min on its own (it waits up to 90s for the
      # post-create panel on top of page setup), which 8 minutes cannot absorb.
      # 11 leaves room for one retry; a second growth spurt should move a spec
      # off shard 1 instead of raising this again.
      #
      # Unaffected by e2e-test.yml's SHARD_COUNT going 4 -> 5 (2026-09-10, to
      # give the new `feedback` project its own shard): shard 1's composition
      # (byline-activation + byline-asyncapi + byline-create + byline-paywall)
      # is unchanged under the 5-way split — `feedback` was declared after
      # `insert` in playwright.config.ts precisely so the added shard grows the
      # TAIL of the list (see e2e-test.yml) rather than shifting shard 1.
      timeout-minutes: 11
      artifact-suffix: lite-stg
    # Creds via `secrets:` (GitHub masks them as ***), not `with:` (echoed in logs).
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  staging-lite-fullscreen-e2e:
    # Keep the DrawIO Publish checks focused on graph-edit.spec.ts. Like the
    # main Lite E2E, run them for the default branch and ready-for-review PRs,
    # but not for draft/branch iteration pushes.
    if: |
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    needs: [staging-lite, build]
    name: "E2E: Lite DrawIO Publish"
    uses: ./.github/workflows/e2e-test.yml
    with:
      app: zenuml-lite@stg
      suite: graph-publish
      # graph-edit.spec.ts declares `test.describe.configure({ mode: 'parallel' })`,
      # so `--shard=N/M` splits its 8 tests across shards instead of stacking all
      # of them on shard 1 (which made this job an 8-minute critical path).
      # Headroom for 2 tests x 3 attempts (retries: 2) plus job setup.
      # e2e-test.yml's SHARD_COUNT went 4 -> 5 (2026-09-10, to give the new
      # `feedback` project its own shard on the `insert` suite — unrelated to
      # graph-publish, but SHARD_COUNT is shared config). That does NOT change
      # this budget: measured at M=5 (`CI=true pnpm exec playwright test --list
      # --project=auth --project=fullscreen tests/fullscreen/graph-edit.spec.ts
      # --shard=N/5`, counting only graph-edit lines) the split is 2/2/2/1/1, so
      # the heaviest shard still carries 2 tests, exactly as it did at M=4.
      # Count graph-edit lines, not Playwright's `Total:` summary — that includes
      # the auth.setup dependency test and reads one higher per shard.
      timeout-minutes: 12
      artifact-suffix: lite-stg-graph-publish
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  staging-lite-render-e2e:
    # render was collected but never gated in CI. Same cadence as the other
    # Lite E2E jobs: default branch, or a PR that's Ready for Review — not
    # draft/branch iteration pushes.
    if: |
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    needs: [staging-lite, build]
    name: "E2E: Lite render"
    uses: ./.github/workflows/e2e-test.yml
    with:
      app: zenuml-lite@stg
      suite: render
      artifact-suffix: lite-stg-render
      # MUST stay unsharded: tests/render/pages.setup.ts (the `pages` project)
      # creates any fixture missing from config/render-fixtures.json, and
      # running it on multiple shards at once would race them into creating
      # the same missing fixture independently — see the shard-matrix input's
      # description in e2e-test.yml.
      shard-matrix: '[1]'
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  staging-full:
    # Lite is representative for feature-branch validation. Full + Diagramly
    # only run on the default branch to catch variant-specific regressions before release;
    # this halves the per-push minutes on feature branches.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: "Deploy: Full"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      variant: full
      license: full
      project: conf-stg-full
      environment: staging-full
    secrets: inherit

  staging-full-e2e:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [staging-full, build]
    name: "E2E: Full"
    uses: ./.github/workflows/e2e-test.yml
    with:
      app: zenuml-full@stg
      suite: insert
      # Shard 5 (the tail shard under e2e-test.yml's SHARD_COUNT=5, see its
      # SHARD_COUNT comment block) now holds typed-deeplink-render plus BOTH
      # feedback-report.spec.ts tests — unlike the prod smoke, this is not
      # `testConfig.isProd`, so the real-backend-write test runs here too.
      # Same headroom as the Lite job's shard-1 override, for the same reason.
      timeout-minutes: 11
      artifact-suffix: full-stg
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  staging-diagramly:
    # See note on staging-full — default-branch-only.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: "Deploy: Diagramly"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      variant: diagramly
      license: diagramly
      project: conf-stg-lite
      environment: staging-diagramly
    secrets: inherit

  staging-asyncapi:
    # Default-branch-only, matching staging-full / staging-diagramly. To validate
    # an in-flight asyncapi PR against asyncapi-stg.atlassian.net before merge,
    # add a temporary `github.head_ref == '<branch>' || github.ref_name ==
    # '<branch>'` clause here and on staging-asyncapi-e2e (a `pull_request` ref is
    # `refs/pull/<N>/merge`, so match head_ref/ref_name, not github.ref) — and
    # drop it before merge so it never lands on main.
    #
    # AsyncAPI shares the lite Cloudflare Pages project for now (per
    # scripts/forge-wizard.mjs); swap to a dedicated `conf-stg-asyncapi`
    # project when one is stood up.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: "Deploy: AsyncAPI"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      variant: asyncapi
      license: asyncapi
      project: conf-stg-lite
      environment: staging-asyncapi
    secrets: inherit

  staging-asyncapi-e2e:
    # Mirror the staging-asyncapi gate so the e2e runs whenever a fresh build
    # is deployed. Skips on draft PRs (matches staging-lite-e2e behaviour).
    if: |
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && !(github.event_name == 'pull_request' && github.event.pull_request.draft == true)
    needs: [staging-asyncapi, build]
    name: "E2E: AsyncAPI"
    uses: ./.github/workflows/e2e-test.yml
    with:
      app: asyncapi@stg
      suite: asyncapi
      artifact-suffix: asyncapi-stg
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  staging-diagramly-e2e:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [staging-diagramly, build]
    name: "E2E: Diagramly"
    uses: ./.github/workflows/e2e-test.yml
    with:
      app: diagramly@stg
      suite: insert
      # See the matching comment on staging-full-e2e: shard 5 now carries
      # typed-deeplink-render plus both feedback-report.spec.ts tests
      # (including the real-backend-write one — this app is not
      # `testConfig.isProd`).
      timeout-minutes: 11
      artifact-suffix: diagramly-stg
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  draft-release-lite:
    name: "Draft: Lite"
    # don't run on pull requests to avoid creating draft releases for pull requests
    # only run on the default branch, to avoid cutting releases from feature branches
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [staging-lite-e2e, staging-lite-fullscreen-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v5

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          VERSION="$(echo $(date +'%Y.%m.%d%H%M'))"
          echo "version=$VERSION" >> $GITHUB_ENV

      # Create new release draft - which is not publicly visible and requires manual acceptance
      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-lite
          name: v${{ env.version }}-lite
          # Pin the draft to the commit this build tested. Without `commit`,
          # target_commitish defaults to the `main` BRANCH and is resolved when
          # the draft is published — so a draft published after a later merge
          # ships that newer commit instead, under this build's version number.
          commit: ${{ github.sha }}
          body: 'This is a draft release for the Lite version of the plugin.'
          draft: true

  draft-release-full:
    name: "Draft: Full"
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [staging-full-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v5

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          VERSION="$(echo $(date +'%Y.%m.%d%H%M'))"
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-full
          name: v${{ env.version }}-full
          # See the Lite draft step: pins the draft to the tested commit.
          commit: ${{ github.sha }}
          body: 'This is a draft release for the Full version of the plugin.'
          draft: true

  draft-release-diagramly:
    name: "Draft: Diagramly"
    # don't run on pull requests to avoid creating draft releases for pull requests
    # only run on the default branch, to avoid cutting releases from feature branches
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [staging-diagramly-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v5

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          VERSION="$(echo $(date +'%Y.%m.%d%H%M'))"
          echo "version=$VERSION" >> $GITHUB_ENV

      # Create new release draft - which is not publicly visible and requires manual acceptance
      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-diagramly
          name: v${{ env.version }}-diagramly
          # See the Lite draft step: pins the draft to the tested commit.
          commit: ${{ github.sha }}
          body: 'This is a draft release for the Diagramly version of the plugin.'
          draft: true

  draft-release-asyncapi:
    name: "Draft: AsyncAPI"
    # Mirrors the lite/full/diagramly drafts. Production release.yml does not
    # yet handle the `asyncapi` variant — when it does, an `asyncapi` tag
    # published from this draft will trigger the prod deploy automatically.
    # Until then the draft is a no-op artifact (intentional: keeps the
    # release cadence aligned across variants).
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [staging-asyncapi-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v5

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          VERSION="$(echo $(date +'%Y.%m.%d%H%M'))"
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-asyncapi
          name: v${{ env.version }}-asyncapi
          # See the Lite draft step: pins the draft to the tested commit.
          commit: ${{ github.sha }}
          body: 'This is a draft release for the AsyncAPI variant of the plugin.'
          draft: true

  deploy-cron-worker:
    name: "Cron: Deploy"
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter cron-aggregate
      - name: Deploy cron-aggregate to staging
        working-directory: workers/cron-aggregate
        run: npx wrangler deploy --env stg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
