# Deploy any branch to whimet4.atlassian.net, as Lite, Full or AsyncAPI, for
# hands-on testing.
#
# Why this exists: whimet4 runs each app in a personal Forge environment
# ("yanhui"), and deploying to it otherwise means running `forge deploy` from a
# laptop. That is fine until the machine cannot do it — e.g. a sandbox whose
# hard file-descriptor cap (4096) is below the file count in `dist/` (~4300),
# where the Forge packager dies with EMFILE. A runner has no such limit.
#
# Scope, deliberately narrow:
#   - Forge only. It does NOT publish to Cloudflare Pages, so the app points at
#     the variant's existing staging backend (conf-stg-lite / conf-stg-full)
#     rather than standing up a new one.
#   - The "yanhui" environment only. Production and staging are never touched.
#     Each variant is a separate Forge app, so each has its own "yanhui"
#     environment; the deploy creates it on first use.
#
# Trigger from the Actions tab: pick a variant, and either pick the branch in
# the "Use workflow from" dropdown or name it in `ref`. `ref` exists so a
# branch cut before this workflow learned a variant (e.g. an open PR) can
# still be deployed as that variant: the workflow file always comes from the
# dropdown branch, while the code comes from `ref`.
#
# Per-variant configuration is NOT copied here. The app identity (APP_ID,
# macro keys, title suffix, staging backend) and the manifest edits are read
# from scripts/forge-wizard.mjs in the deployed ref — the same source of truth
# the local wizard deploys from — so a branch that changes a variant's edits
# (as PR #764 did) is deployed with its own edits, not with this file's.
name: Deploy branch to whimet4 (dev)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which app to deploy'
        type: choice
        options:
          - lite
          - full
          - asyncapi
        default: lite
      ref:
        description: 'Branch, tag or SHA to deploy (empty = the "Use workflow from" branch)'
        type: string
        default: ''
      install:
        description: 'Also install/upgrade the app on whimet4 (needed on first deploy of a variant, and after a module or scope change)'
        type: boolean
        default: true

concurrency:
  # One deploy at a time to a single shared dev site — a second run would race
  # the first's `forge deploy`. Not cancel-in-progress: killing a half-finished
  # deploy is worse than queueing behind it.
  group: deploy-whimet4
  cancel-in-progress: false

jobs:
  deploy:
    name: 'Deploy: whimet4 (${{ inputs.variant }})'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # whimet4-specific Forge credentials, falling back to the shared CI ones.
      # The shared principal (support@zenuml.com) is not a site admin of
      # whimet4, so install/upgrade there returns "insufficient permissions" —
      # fine for a minor version, which auto-applies, but it cannot consent to a
      # MAJOR one (scope / module changes) or to a first install. WHIMET4_*
      # holds the site owner's credentials so those land too. The `||` keeps
      # the workflow working if they are ever unset rather than deploying as an
      # empty principal.
      FORGE_EMAIL: "${{ vars.WHIMET4_FORGE_EMAIL || vars.FORGE_EMAIL }}"
      FORGE_API_TOKEN: "${{ secrets.WHIMET4_FORGE_API_TOKEN || secrets.FORGE_API_TOKEN }}"
      # whimet4's Forge environment. Not "development" — the installs live in a
      # named custom environment (see `forge install list`).
      FORGE_ENV: yanhui
      SITE: whimet4.atlassian.net
      VARIANT: ${{ inputs.variant }}
      DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      # `pnpm build:lite` and `build:asyncapi` chain `build:studio`, which
      # builds AsyncAPI Studio from the vendor/asyncapi-studio submodule (Lite
      # ships the AsyncAPI macro per ADR-0005). `actions/checkout@v5` does NOT
      # init submodules, so init this one explicitly — and only this one, so
      # the private submodule isn't attempted. Mirrors staging-deploy.yml.
      - name: Init asyncapi-studio submodule
        if: inputs.variant != 'full'
        run: git submodule update --init --depth 1 vendor/asyncapi-studio

      # No `version` input: package.json's `packageManager` field is the single
      # source of the pnpm version, and action-setup hard-errors when the two
      # disagree ("Multiple versions of pnpm specified").
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The manifest's ${APP_ID}, ${CONNECT_KEY}, ${SEQUENCE_MACRO_KEY}, ... are
      # substituted from the environment at `forge deploy` time. Lite's values
      # are the manifest defaults, which is why this workflow could only ever
      # deploy Lite before it exported them.
      - name: Resolve ${{ inputs.variant }} app identity from scripts/forge-wizard.mjs
        run: |
          node --input-type=module -e '
            const { getAppConfig } = await import("./scripts/forge-wizard.mjs")
            const app = getAppConfig(process.env.VARIANT)
            const env = {
              APP_ID: app.appId,
              CONNECT_KEY: app.connectKey,
              SEQUENCE_MACRO_KEY: app.sequenceMacroKey,
              CUSTOM_CONTENT_KEY: app.customContentKey,
              LITE_KEY_SUFFIX: app.liteKeySuffix,
              LITE_TITLE_SUFFIX: app.liteTitleSuffix,
              APP_LABEL: app.appLabel,
              BACKEND_API_BASE_URL: app.backendUrls.staging,
            }
            for (const [k, v] of Object.entries(env)) console.log(`${k}=${v ?? ""}`)
          ' | tee -a "$GITHUB_ENV"

      # `resources.main` in manifest.yml points at dist/, so the Custom UI
      # assets have to exist before `forge deploy` packages the app.
      - name: Build ${{ inputs.variant }} frontend
        run: pnpm build:${VARIANT}
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          VITE_MIXPANEL_TOKEN: ${{ vars.VITE_MIXPANEL_TOKEN }}
          VITE_APP_VERSION: "${{ inputs.ref || github.ref_name }}-${{ inputs.variant }}"

      # Pinned mikefarah yq v4. The runner image's `yq` is not guaranteed to be
      # the same tool across image updates, and the wizard's expressions are
      # written for v4.
      - name: Install yq
        run: |
          curl -fsSL -o "$RUNNER_TEMP/yq" https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Applied exactly as the local wizard applies them (`yq eval <expr> -i`).
      # Deploying the unedited manifest would ship modules the variant does not
      # have — and any scope change that implies would make the install need
      # re-consent, which --non-interactive cannot give.
      - name: Apply ${{ inputs.variant }} manifest edits from scripts/forge-wizard.mjs
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process"
            const { getAppConfig } = await import("./scripts/forge-wizard.mjs")
            for (const edit of getAppConfig(process.env.VARIANT).manifestEdits) {
              console.log(`- ${edit.description}`)
              execFileSync("yq", ["eval", edit.yqEvalExpr, "-i", "manifest.yml"], { stdio: "inherit" })
            }
          '

      - name: Upload final manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ inputs.variant }}-whimet4
          path: manifest.yml
          retention-days: 7

      - name: Deploy to Forge (${{ env.FORGE_ENV }})
        env:
          MIXPANEL_TOKEN: ${{ vars.VITE_MIXPANEL_TOKEN }}
        run: |
          pnpm forge:deploy:disable-analytics
          # Each variant is its own Forge app, so "yanhui" has to exist per app.
          # Lite's and AsyncAPI's already did; Full's is created on first use.
          # Captured first: under the runner's `pipefail`, `grep -q` exiting on
          # its first match can SIGPIPE the producer and read as "not found".
          ENVS="$(pnpm exec forge environments list)"
          if ! grep -qw "$FORGE_ENV" <<<"$ENVS"; then
            echo "Creating Forge environment $FORGE_ENV for app $APP_ID"
            pnpm exec forge environments create -e "$FORGE_ENV" --non-interactive
          fi
          pnpm exec forge variables set MIXPANEL_TOKEN "$MIXPANEL_TOKEN" -e "$FORGE_ENV"
          pnpm exec forge variables set BACKEND_API_BASE_URL "$BACKEND_API_BASE_URL" -e "$FORGE_ENV"
          pnpm exec forge deploy -e "$FORGE_ENV" --non-interactive --verbose

      # Non-fatal, for two reasons learned from the first real run:
      #
      # 1. It is usually unnecessary. A minor version (no scope or module
      #    change) auto-applies to existing installs — only a major version
      #    needs re-consent, and --non-interactive could not give it anyway.
      # 2. It needs the Forge principal to be a site admin of whimet4. The
      #    shared CI principal (support@zenuml.com) is not: install and upgrade
      #    both return "insufficient permissions" there. That is a property of
      #    whose credentials CI holds, not of the deploy.
      #
      # The deploy above is the meaningful outcome, so a failure here must not
      # fail the job. The summary reports the two separately — but on a FIRST
      # deploy of a variant, a failure here means the app is not on whimet4.
      #
      # install is idempotent-ish: it fails when the app is already installed,
      # so fall through to upgrade. Same pattern as the staging installs.
      - name: Install / upgrade on whimet4
        id: install
        if: inputs.install
        continue-on-error: true
        run: |
          pnpm exec forge install --site "$SITE" --product confluence -e "$FORGE_ENV" --non-interactive \
            || pnpm exec forge install --upgrade --site "$SITE" --product confluence -e "$FORGE_ENV" --non-interactive

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Deployed to whimet4"
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Ref | \`$DEPLOY_REF\` |"
            echo "| Commit | \`$(git rev-parse HEAD)\` |"
            echo "| Variant | $VARIANT (app \`${APP_ID:-unresolved}\`) |"
            echo "| Backend | ${BACKEND_API_BASE_URL:-unresolved} |"
            echo "| Forge environment | \`$FORGE_ENV\` |"
            echo "| Site | https://$SITE/wiki |"
            echo "| Deploy | ${{ job.status }} |"
            echo "| Install/upgrade | ${{ inputs.install && steps.install.outcome || 'skipped' }} |"
            if [ "${{ steps.install.outcome }}" = "failure" ]; then
              echo ""
              echo "> Install/upgrade failed but the deploy landed. On an existing install"
              echo "> this is expected when the Forge account is not a site admin of whimet4;"
              echo "> a minor version auto-applies, so no action is usually needed. On the"
              echo "> FIRST deploy of a variant it means the app is not installed on whimet4."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
