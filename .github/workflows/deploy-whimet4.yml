# Deploy any branch to whimet4.atlassian.net for hands-on testing.
#
# Why this exists: whimet4 runs the Lite app in a personal Forge environment
# ("yanhui"), and deploying to it otherwise means running `forge deploy` from a
# laptop. That is fine until the machine cannot do it — e.g. a sandbox whose
# hard file-descriptor cap (4096) is below the file count in `dist/` (~4300),
# where the Forge packager dies with EMFILE. A runner has no such limit.
#
# Scope, deliberately narrow:
#   - Forge only. It does NOT publish to Cloudflare Pages, so the app points at
#     the existing conf-stg-lite backend rather than standing up a new one.
#   - The "yanhui" environment only. Production and staging are never touched.
#
# Trigger from the Actions tab, pick the branch in the "Use workflow from"
# dropdown, and Run workflow.
name: Deploy branch to whimet4 (dev)

on:
  workflow_dispatch:
    inputs:
      install:
        description: 'Also install/upgrade the app on whimet4 (needed after a module or scope change)'
        type: boolean
        default: true
      variant:
        description: 'App to build and deploy. Full deploys the Full app (its own "yanhui" environment) next to Lite on whimet4; the two use different Connect keys, so both can be installed.'
        type: choice
        options: [lite, full]
        default: lite

concurrency:
  # One deploy at a time to a single shared dev environment — a second run
  # would race the first's `forge deploy`. Not cancel-in-progress: killing a
  # half-finished deploy is worse than queueing behind it.
  group: deploy-whimet4
  cancel-in-progress: false

jobs:
  deploy:
    name: 'Deploy: whimet4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # whimet4-specific Forge credentials, falling back to the shared CI ones.
      # The shared principal (support@zenuml.com) is not a site admin of
      # whimet4, so install/upgrade there returns "insufficient permissions" —
      # fine for a minor version, which auto-applies, but it cannot consent to a
      # MAJOR one (scope / module changes). WHIMET4_* holds the site owner's
      # credentials so those land too. The `||` keeps the workflow working if
      # they are ever unset rather than deploying as an empty principal.
      FORGE_EMAIL: "${{ vars.WHIMET4_FORGE_EMAIL || vars.FORGE_EMAIL }}"
      FORGE_API_TOKEN: "${{ secrets.WHIMET4_FORGE_API_TOKEN || secrets.FORGE_API_TOKEN }}"
      # whimet4's Forge environment. Not "development" — the install lives in a
      # named custom environment (see `forge install list`).
      FORGE_ENV: yanhui
      SITE: whimet4.atlassian.net
      VARIANT: ${{ inputs.variant || 'lite' }}
    steps:
      - uses: actions/checkout@v5

      # `pnpm build:lite` chains `build:studio`, which builds AsyncAPI Studio
      # from the vendor/asyncapi-studio submodule (Lite ships the AsyncAPI
      # macro per ADR-0005). `actions/checkout@v5` does NOT init submodules,
      # so init this one explicitly — and only this one, so the private
      # submodule isn't attempted. Mirrors staging-deploy.yml / release.yml.
      - name: Init asyncapi-studio submodule
        run: git submodule update --init --depth 1 vendor/asyncapi-studio

      # No `version` input: package.json's `packageManager` field is the single
      # source of the pnpm version, and action-setup hard-errors when the two
      # disagree ("Multiple versions of pnpm specified").
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `resources.main` in manifest.yml points at dist/, so the Custom UI
      # assets have to exist before `forge deploy` packages the app.
      # build:lite chains build:studio (AsyncAPI macro); build:full does too
      # from ADR-0005 Half 1 (PR #1344) on.
      - name: Build ${{ env.VARIANT }} frontend
        run: pnpm build:$VARIANT
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          VITE_MIXPANEL_TOKEN: ${{ vars.VITE_MIXPANEL_TOKEN }}
          VITE_APP_VERSION: "${{ github.ref_name }}-${{ github.sha }}"

      # Variant manifest edits come from scripts/forge-wizard.mjs, the same
      # list the wizard applies for development, so staging and production
      # cannot drift from it (see scripts/ci/manifest-edits.mjs).
      - name: Write the variant manifest edits
        run: node scripts/ci/manifest-edits.mjs "$VARIANT" manifest-edits.sh
      - name: Apply the variant manifest edits
        uses: mikefarah/yq@master
        with:
          cmd: sh manifest-edits.sh
      - name: Upload final manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ env.VARIANT }}-whimet4
          path: manifest.yml
          retention-days: 7

      - name: Deploy to Forge (${{ env.FORGE_ENV }})
        env:
          MIXPANEL_TOKEN: ${{ vars.VITE_MIXPANEL_TOKEN }}
        run: |
          pnpm forge:deploy:disable-analytics
          if [ "$VARIANT" = full ]; then
            # Same identity as forge:deploy:full:staging in package.json; the
            # fixed Full Connect key is fine because whimet4 has no other Full
            # environment installed.
            export APP_ID=d9e4002b-120b-426b-834b-402a4a5adce7
            export CONNECT_KEY=com.zenuml.confluence-addon
            export SEQUENCE_MACRO_KEY=zenuml-sequence-macro
            export CUSTOM_CONTENT_KEY=zenuml-content-sequence
            export LITE_KEY_SUFFIX=
            export LITE_TITLE_SUFFIX=
            export APP_LABEL='ZenUML for Confluence'
            export BACKEND_API_BASE_URL=https://conf-stg-full.zenuml.com
          else
            # Default APP_ID (no override) is the Lite app.
            export BACKEND_API_BASE_URL=https://conf-stg-lite.zenuml.com
          fi
          pnpm exec forge variables set MIXPANEL_TOKEN "$MIXPANEL_TOKEN" -e "$FORGE_ENV"
          pnpm exec forge variables set BACKEND_API_BASE_URL "$BACKEND_API_BASE_URL" -e "$FORGE_ENV"
          pnpm exec forge deploy -e "$FORGE_ENV" --non-interactive --verbose

      # Non-fatal, for two reasons learned from the first real run:
      #
      # 1. It is usually unnecessary. A minor version (no scope or module
      #    change) auto-applies to existing installs — only a major version
      #    needs re-consent, and --non-interactive could not give it anyway.
      # 2. It needs the CI Forge principal (support@zenuml.com) to be a site
      #    admin of whimet4, which it is not: install and upgrade both return
      #    "insufficient permissions" there. That is a property of whose
      #    credentials CI holds, not of the deploy.
      #
      # The deploy above is the meaningful outcome, so a failure here must not
      # fail the job. The summary reports the two separately.
      #
      # install is idempotent-ish: it fails when the app is already installed,
      # so fall through to upgrade. Same pattern as the staging installs.
      - name: Install / upgrade on whimet4
        id: install
        if: inputs.install
        continue-on-error: true
        run: |
          if [ "$VARIANT" = full ]; then export APP_ID=d9e4002b-120b-426b-834b-402a4a5adce7; fi
          pnpm exec forge install --site "$SITE" --product confluence -e "$FORGE_ENV" --non-interactive \
            || pnpm exec forge install --upgrade --site "$SITE" --product confluence -e "$FORGE_ENV" --non-interactive

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Deployed to whimet4"
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Variant | $VARIANT |"
            echo "| Forge environment | \`$FORGE_ENV\` |"
            echo "| Site | https://$SITE/wiki |"
            echo "| Deploy | succeeded |"
            echo "| Install/upgrade | ${{ inputs.install && steps.install.outcome || 'skipped' }} |"
            if [ "${{ steps.install.outcome }}" = "failure" ]; then
              echo ""
              echo "> Install/upgrade failed but the deploy landed. This is expected when the"
              echo "> CI Forge account is not a site admin of whimet4; a minor version"
              echo "> auto-applies to the existing install, so no action is usually needed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
