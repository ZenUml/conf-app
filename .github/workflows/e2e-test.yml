name: E2E Test

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
        description: 'App profile (e.g., zenuml-lite@stg)'
      suite:
        type: string
        default: 'all'
        description: 'Test suite: all, insert, render, fullscreen, graph-publish, asyncapi'
      timeout-minutes:
        type: number
        default: 8
        description: 'Per-shard job timeout. graph-publish needs more: sharding cannot split a single spec file, so one shard runs the whole suite serially against live Confluence.'
      artifact-suffix:
        type: string
        required: true
      node-version:
        type: string
        default: '24.x'
      retries:
        type: string
        default: ''
        required: false
        description: >-
          Override Playwright --retries. The post-deploy prod smoke passes "1":
          a cold-render content-verify wedge cannot pass on retry (the render is
          cold on every attempt), so the config default (2 on CI) just burns the
          shard's 8-min budget toward a reap. Empty = keep the config default.
    # Credentials are SECRETS, not inputs. A reusable workflow's `inputs` are
    # echoed verbatim in the run logs (GitHub does not mask them), so the
    # Atlassian username/password and the TOTP seed leaked into every E2E log
    # when passed via `with:`. Declaring them under `secrets:` means GitHub
    # registers the values for masking and renders them as `***`. Callers pass
    # them through a job-level `secrets:` block (sourced from repo vars.*),
    # never `with:`.
    secrets:
      username:
        required: true
        description: 'Confluence username used by the Playwright auth bootstrap'
      password:
        required: true
        description: 'Confluence password used by the Playwright auth bootstrap'
      otp:
        required: true
        description: 'TOTP secret used by tests/e2e-tests/utils/otp.js'

# Auth is DEDUPLICATED. A single `auth` job logs in once and uploads the
# Playwright storageState as an artifact; every shard downloads it, so
# auth.setup.ts's `fs.existsSync(AUTH_STATE_PATH)` skip fires and the shards
# never log in. This removes the per-shard Atlassian OTP login — the dominant
# E2E flake (a TOTP retry balloons a shard's auth bootstrap by ~3min) — and
# decouples shard count from auth-flake exposure, so scaling shards no longer
# multiplies the chance of a slow run. If the artifact is missing, the shard
# falls through to its own login (the pre-existing behavior, kept as fallback).
#
# Spec-level parallelism via Playwright's `--shard=N/M`. With auth deduped above,
# shards do pure test work (no per-shard login), so scaling shards finally cuts
# wall-clock instead of multiplying auth-flake exposure (the reason an earlier
# N=4 attempt without dedup was slower). The `insert)` case below runs
# `--project=auth --project=insert --project=feedback`: `insert` alone is
# 17 files (`ls tests/insert`, 2026-08-30) since the typed-deeplink, byline and
# byline-asyncapi specs were added, of which 15 are real specs (insert-helpers.ts
# is a helper module, not a spec, and spot-check-metrics-fix.spec.ts is excluded
# from collection in CI — see playwright.config.ts); `feedback` adds one more
# spec file (tests/feedback/feedback-report.spec.ts, 2 tests). Variant skips are
# evaluated at RUN time, so a static count is an upper bound rather than the Lite
# figure.
# Note: `--shard` splits CONTIGUOUSLY by file and can't split within a
# file, so the dense paywall spec bounds the heaviest shard — and files sort by
# name, so every `byline-*` spec piles onto shard 1. That is
# why byline-create folds its listing assertion into the create test rather than
# adding a third slow test to that shard.
#
# `--shard` orders the combined test list by PROJECT DECLARATION ORDER first
# (as listed in playwright.config.ts's `projects` array), then by path-sorted
# file within each project — NOT by a flat alphabetical merge of file paths
# across projects. `feedback` is declared immediately after `insert` in that
# array specifically so its file sorts after every `insert/` file rather than
# interleaving alphabetically (`feedback` < `insert` as bare strings) and
# reshuffling the boundaries documented below. Confirmed by measurement
# (2026-09-10, `pnpm exec playwright test --list --project=auth --project=insert
# --project=feedback --shard=N/5`), not derived by reasoning about sort order —
# always re-measure with `--list` after changing file counts rather than
# recomputing shard placement by hand.
#
# Shard 1 is the one to watch, and it has grown. Measured on the Lite job:
#   2026-08-08  6 tests         byline-create + byline-paywall + close-guard + edit-graph
#   2026-08-29  6 tests  3m36s  run 33252116691 (head b15caec)
#   2026-08-30  8 tests  5m35s  run 33281984333 (head 6b1f6f2) — byline-asyncapi
#                               sorts at #2 of 17 and landed here
# All of the above were measured at SHARD_COUNT=4. Under SHARD_COUNT=5, shard 1
# is UNCHANGED (still byline-activation + byline-asyncapi(x2) + byline-create(x2)
# + byline-paywall, 7 tests / 5 files) — the extra shard only moves the boundary
# further down the list; it does not touch shard 1's composition. The Lite caller
# therefore keeps its timeout-minutes above the 8 default; the retry arithmetic is
# on the `E2E: Lite` job in build-test-deploy.yml. If shard 1 grows again, move a
# byline spec out of the `byline-*` name range rather than raising the ceiling a
# second time.
#
# Under SHARD_COUNT=5 (2026-09-10 measurement, insert+feedback combined):
#   shard 1 (7 tests / 5 files): byline-activation, byline-asyncapi, byline-create,
#                                 byline-paywall
#   shard 2 (7 tests / 6 files): close-guard, edit-graph, embed-deeplink-autoconvert,
#                                 graph, m1-first-seen-ping
#   shard 3 (6 tests / 4 files): mermaid, openapi, paywall-page-banner (3 tests) —
#                                 sequence.spec.ts moved OUT to shard 4 (it sat in
#                                 shard 3 under SHARD_COUNT=4); this is the "PROD
#                                 lite smoke shard 3" referenced in the `test` job's
#                                 timeout comment below — its byte-for-byte spec set
#                                 changed, so treat that comment's timing as
#                                 directional (measured at SHARD_COUNT=4) until
#                                 re-measured live.
#   shard 4 (7 tests / 3 files): sequence, typed-deeplink-autoconvert (5 tests)
#   shard 5 (4 tests / 3 files): typed-deeplink-render, feedback-report.spec.ts
#                                 (2 tests) — typed-deeplink-render builds its own
#                                 fixture (insert a graph, publish, read back its
#                                 custom content, paste a link to it on a second
#                                 page) and was already the longest single insert
#                                 test; feedback-report.spec.ts adds two more
#                                 real-Confluence page creations (one per test — see
#                                 that file's header for why it's two tests, not
#                                 six). Shard 5 is now the one to watch for growth,
#                                 the same way shard 1 was under SHARD_COUNT=4.
#
# On Full/Diagramly the paywall spec is skipped (Lite-only), so a couple of their
# shards are near-idle — cheap now that they no longer each pay an OTP login. The
# `insert)` case (and therefore this shard layout) also runs against the
# production callers in smoke-test.yml and release.yml; feedback-report.spec.ts's
# backend-write test (assertion 6 in its header) is gated on `testConfig.isProd`
# and skips immediately there, but its other test (surfaces 1-5, one page
# creation) does run on every `insert`-suite call, prod included. Keep
# strategy.matrix.shard in sync with SHARD_COUNT.
env:
  SHARD_COUNT: 5

jobs:
  # Log in ONCE per run and publish the storageState so every shard reuses it
  # instead of doing its own (flaky) Atlassian OTP login.
  auth:
    name: auth bootstrap
    runs-on: ubuntu-latest
    # EVERY caller of this workflow logs in as the same robot account and reads the
    # same `vars.ATLASSIAN_OTP`, so any two bootstraps that overlap can be handed the
    # same TOTP code and the loser fails. That is not limited to one app: the five
    # staging callers in build-test-deploy.yml (Lite, Lite DrawIO Publish, Full,
    # Diagramly, AsyncAPI) and the three production callers in smoke-test.yml all
    # pass the same OTP variable. Observed 2026-09-01: two zenuml-lite@stg bootstraps
    # started in the same second, DrawIO's finished at 09:37:09Z, and the other logged
    # `OTP attempt 1 failed, retrying...` and was reaped, which skipped every
    # E2E: Lite shard.
    #
    # The group key is therefore a repo-wide constant, not per app — concurrency
    # groups are scoped to the repository, so one constant serialises every bootstrap
    # in every workflow and on every branch.
    #
    # `queue: max` is required, not decoration. The default is `queue: single`, where
    # "at most one job or workflow run can be pending in the concurrency group" and a
    # newly queued job CANCELS the one already pending. With five callers on one
    # constant group that would cancel three of them. `max` allows up to 100 pending
    # and releases them first-in-first-out. It cannot be combined with
    # `cancel-in-progress: true`, which this job does not use.
    #
    # Wall-clock cost is small because the callers are already close to serial.
    # Measured on main run 33510893735 (2026-09-01), the five bootstraps ran
    # 13:04:31-13:08:37, a 4m06s span for 3m14s of work, with a single 10-second
    # overlap between AsyncAPI and Lite DrawIO Publish. After the first login of the
    # day every later bootstrap restores the daily cache and skips login entirely.
    concurrency:
      group: e2e-auth
      cancel-in-progress: false
      queue: max
    # A clean OTP login took 42-55s in the four uncollided bootstraps measured on
    # 2026-09-01. 2 minutes reaped a legitimate retry mid-flight; 4 covers the full
    # 3-attempt cycle and still reaps a hung login well inside a shard's budget.
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - name: Install E2E test dependencies
        run: cd tests/e2e-tests && pnpm install --ignore-workspace
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('tests/e2e-tests/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: cd tests/e2e-tests && pnpm exec playwright install --with-deps chromium
      - name: Compute daily cache key
        id: cacheday
        run: echo "key=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore cached auth session
        # The Atlassian session lasts ~30 days, so a daily key is well inside its
        # validity: the day's first run logs in and caches the storageState; later
        # runs restore it and auth.setup.ts validates liveness, then skips login. A
        # stale/revoked session self-heals (auth.setup deletes it and re-logs-in).
        # actions/cache writes the cache only on a restore miss, so most days = 1 login.
        uses: actions/cache@v5
        with:
          path: tests/e2e-tests/auth-state-*.json
          key: auth-session-${{ inputs.artifact-suffix }}-${{ steps.cacheday.outputs.key }}
      - name: Authenticate once (writes auth-state-<domain>.json)
        run: cd tests/e2e-tests && pnpm exec playwright test --project=auth
        env:
          APP: ${{ inputs.app }}
          CI: true
          ZENUML_STAGE_USERNAME: ${{ secrets.username }}
          ZENUML_STAGE_PASSWORD: ${{ secrets.password }}
          ATLASSIAN_OTP: ${{ secrets.otp }}
      - name: Upload shared auth state
        uses: actions/upload-artifact@v6
        with:
          name: auth-state-${{ inputs.artifact-suffix }}
          path: ./tests/e2e-tests/auth-state-*.json
          retention-days: 1
          if-no-files-found: error

  test:
    name: shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: auth
    runs-on: ubuntu-latest
    # Reap a wedged shard before a human would (a test stuck at the 300s test
    # timeout x3 retries = ~15 min), while leaving room for the SLOWEST legit
    # shard to finish AND for a wedge to fail named-with-trace.
    #
    # 8, not 5: staging shards finish in ~3m20s (slowest: Lite 1/4), but on PROD
    # the lite smoke's shard 3 runs the lite-only specs that full/diagramly skip
    # and needs ~5.3 min — so a 5 min cap reaped it deterministically every lite
    # release (e.g. v2026.06.131152-lite run 27466212531 and v2026.06.171149-lite
    # run 27689056495, both shard 3/4 cancelled at ~5m20s). Worse, 5 min EQUALS
    # the 300s per-test timeout, so a real wedge was cancelled at the same instant
    # its trace would upload — losing the evidence (shard-3 report artifact missing).
    # 8 min sits safely above one 300s test-timeout: a slow-but-passing shard
    # completes, a genuinely-wedged test fails NAMED with a trace at 300s before
    # the cap, and a 2-retry wedge (~15 min) is still reaped far faster than a human.
    #
    # These figures predate SHARD_COUNT=5 (see the layout note above `env:`).
    # Shard 3 still holds the lite-only paywall-page-banner spec under N=5, so the
    # "needs ~5.3 min" claim is still the right shard to watch, but its file set
    # shrank by one (sequence.spec.ts moved to shard 4) — re-measure rather than
    # assume the number is unchanged.
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      # tests/e2e-tests is a standalone package (not in pnpm-workspace.yaml)
      # with only @playwright/test, otpauth, and dotenv as dependencies. It does
      # not import any code from the main workspace, so installing the main
      # app's dependency tree here is dead weight (~60–90 s wall-clock per job).
      - name: Install E2E test dependencies
        run: cd tests/e2e-tests && pnpm install --ignore-workspace
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('tests/e2e-tests/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: cd tests/e2e-tests && pnpm exec playwright install --with-deps chromium
      - name: Download shared auth state
        # From the `auth` job: drops auth-state-<domain>.json into tests/e2e-tests/
        # so auth.setup.ts's fs.existsSync skip fires and this shard does NOT log in.
        # continue-on-error → if the artifact is absent the shard falls through to
        # its own login (the pre-existing behavior).
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: auth-state-${{ inputs.artifact-suffix }}
          path: ./tests/e2e-tests/
      - name: Run tests
        run: |
          cd tests/e2e-tests
          # Build the project filter list per suite — same as the per-suite
          # pnpm scripts, but inlined so we can append `--shard=N/M` for
          # spec-level parallelism. The `auth` setup project still runs but skips
          # its login (storageState was downloaded above); `pages` runs per shard
          # only for the render/all suites.
          TEST_TARGET=""
          case "${{ inputs.suite }}" in
            insert)
              # `feedback` rides along here (see the SHARD_COUNT comment block
              # above `env:` for why it's declared after `insert` in
              # playwright.config.ts and where it lands under the 5-shard split).
              PROJECTS="--project=auth --project=insert --project=feedback"
              ;;
            render)
              PROJECTS="--project=auth --project=pages --project=render"
              ;;
            fullscreen)
              # Fullscreen modal coverage, including all editor families.
              PROJECTS="--project=auth --project=fullscreen"
              ;;
            graph-publish)
              # Keep the DrawIO Publish gate focused: graph-edit:5/6/7 cover
              # Diagram, Board, and the Board publish/view lifecycle while
              # sharing the existing auth/fullscreen projects. Do not silently
              # run the entire fullscreen suite. The spec runs in parallel mode
              # so the 5 shards below each get a share of its 8 tests — measured
              # (2026-09-10) as 2/2/2/1/1 tests per shard 1-5, un-idle on every
              # shard. Count graph-edit lines from `--list`, not Playwright's
              # `Total:` summary: that adds the auth.setup dependency test and
              # reads one higher per shard.
              PROJECTS="--project=auth --project=fullscreen"
              TEST_TARGET="tests/fullscreen/graph-edit.spec.ts"
              ;;
            asyncapi)
              # Three spec files today (create-edit, dashboard-loads,
              # macro-create-edit — no longer the single-spec smoke this comment
              # once described). The shard matrix below still creates 5 runners;
              # measured (2026-09-10) as 4/0/2/3/0 tests per shard 1-5 — shards 2
              # and 5 are empty / pass instantly, the others are not.
              PROJECTS="--project=auth --project=asyncapi"
              ;;
            *)
              PROJECTS="--project=auth --project=pages --project=render --project=insert --project=feedback --project=syntax-validation"
              ;;
          esac
          # Optional --retries override (empty input → keep playwright.config default).
          RETRY_FLAG=""
          [ -n "${{ inputs.retries }}" ] && RETRY_FLAG="--retries=${{ inputs.retries }}"
          pnpm exec playwright test --ignore-snapshots $PROJECTS \
            --shard=${{ matrix.shard }}/${{ env.SHARD_COUNT }} $RETRY_FLAG $TEST_TARGET
        env:
          APP: ${{ inputs.app }}
          CI: true
          ZENUML_STAGE_USERNAME: ${{ secrets.username }}
          ZENUML_STAGE_PASSWORD: ${{ secrets.password }}
          ATLASSIAN_OTP: ${{ secrets.otp }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ inputs.artifact-suffix }}-shard-${{ matrix.shard }}
          path: ./tests/e2e-tests/playwright-report/
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-${{ inputs.artifact-suffix }}-shard-${{ matrix.shard }}
          path: ./tests/e2e-tests/screenshots/
          # Tests only write screenshots on failure; suppress the "no files
          # found" warning that fires on every green run.
          if-no-files-found: ignore
