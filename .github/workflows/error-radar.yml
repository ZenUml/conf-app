name: Error radar

# Daily detector for new and unusual conf-app error signatures in Mixpanel
# (.claude/skills/error-radar/SKILL.md). Posts to #zenuml2 by webhook; the
# Claude scheduled task "Error radar triage" replies in that thread.
#
# The radar output names real tenants and this repository's logs are public:
# the run step prints only --quiet's tenant-free summary, and nothing is
# uploaded as an artifact.

on:
  schedule:
    - cron: '47 21 * * *'   # 08:47 AEDT / 07:47 AEST, after the UTC day closes
  workflow_dispatch:
    inputs:
      day:
        description: 'UTC day to examine (YYYY-MM-DD); empty = yesterday'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: error-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests
        run: |
          python3 -m unittest discover -s .claude/skills/error-radar/scripts -p 'test_*.py'
          node --test .claude/skills/error-radar/scripts/signature_test.js
      # The username is not sensitive and may be a repository secret or a
      # variable. The service-account secret and the webhook must be
      # secrets: GitHub prints variables verbatim in the step's env block,
      # and this repository's logs are public, so a webhook saved as a
      # variable is published to anyone (it happened once, 2026-10-24). This
      # step sees only true/false for those two, never their values.
      - name: Check configuration
        env:
          MIXPANEL_SA_USER: ${{ secrets.MIXPANEL_SA_USER || vars.MIXPANEL_SA_USER }}
          HAS_MIXPANEL_SA_SECRET: ${{ secrets.MIXPANEL_SA_SECRET != '' }}
          HAS_SLACK_ERROR_RADAR_WEBHOOK: ${{ secrets.SLACK_ERROR_RADAR_WEBHOOK != '' }}
          VAR_MIXPANEL_SA_SECRET: ${{ vars.MIXPANEL_SA_SECRET != '' }}
          VAR_SLACK_ERROR_RADAR_WEBHOOK: ${{ vars.SLACK_ERROR_RADAR_WEBHOOK != '' }}
        run: |
          failed=0
          where="Settings > Secrets and variables > Actions"
          if [ -z "$MIXPANEL_SA_USER" ]; then
            echo "::error::MIXPANEL_SA_USER is not set: add it under $where (secret or variable)."
            failed=1
          fi
          for name in MIXPANEL_SA_SECRET SLACK_ERROR_RADAR_WEBHOOK; do
            has="HAS_$name"; var="VAR_$name"
            if [ "${!var}" = "true" ]; then
              echo "::error::$name is saved as a variable, which prints it in this public log. Delete the variable, rotate the value, and save it under $where > Secrets."
              failed=1
            elif [ "${!has}" != "true" ]; then
              echo "::error::$name is not set: add it under $where > Secrets."
              failed=1
            fi
          done
          exit $failed
      - name: Detect and post
        env:
          MIXPANEL_SA_USER: ${{ secrets.MIXPANEL_SA_USER || vars.MIXPANEL_SA_USER }}
          MIXPANEL_SA_SECRET: ${{ secrets.MIXPANEL_SA_SECRET }}
          SLACK_ERROR_RADAR_WEBHOOK: ${{ secrets.SLACK_ERROR_RADAR_WEBHOOK }}
          DAY: ${{ inputs.day }}
        run: |
          python3 .claude/skills/error-radar/scripts/radar.py --quiet --post ${DAY:+--day "$DAY"}
