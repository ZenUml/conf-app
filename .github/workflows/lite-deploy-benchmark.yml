name: Lite Deploy Benchmark
run-name: "Lite deploy experiment · ${{ inputs.pairs || '1' }} pairs · source ${{ inputs.source-sha || '1a7e4a0bf' }}"

on:
  push:
    branches: [ci/lite-deploy-20pct]
    paths: [.github/workflows/lite-deploy-benchmark.yml]
  workflow_dispatch:
    inputs:
      source-sha:
        type: string
        required: true
        default: '1a7e4a0bf'
        description: 'Immutable main source commit, shared by both arms'
      pairs:
        type: choice
        options: ['1', '3']
        default: '1'
        description: 'One preliminary pair or three measured pairs'

permissions:
  contents: read
  actions: read

# Shared staging ownership covers every deployment and timing report.
# Reusable deploy calls use their distinct inner group, avoiding nested locks.
concurrency:
  group: conf-app-staging
  cancel-in-progress: false
  queue: max

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      pairs: ${{ steps.pin.outputs.pairs }}
      tooling-sha: ${{ steps.pin.outputs.tooling-sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: pin
        env:
          REQUESTED_SHA: ${{ inputs.source-sha || '1a7e4a0bf' }}
          PAIRS: ${{ inputs.pairs || '1' }}
          TOOLING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{7,40}$ ]]
          [[ "$PAIRS" = 1 || "$PAIRS" = 3 ]]
          SOURCE_SHA=$(git rev-parse "$REQUESTED_SHA^{commit}")
          git merge-base --is-ancestor "$SOURCE_SHA" "origin/${{ github.event.repository.default_branch }}"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "pairs=$PAIRS" >> "$GITHUB_OUTPUT"
          echo "tooling-sha=$TOOLING_SHA" >> "$GITHUB_OUTPUT"

  migrations:
    name: Shared staging D1 migrations
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-lite
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply shared staging D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp wrangler-stg.toml wrangler.toml
          pnpm exec wrangler d1 migrations apply DB --remote --env production

  baseline-1:
    name: baseline-1
    needs: [migrations, target]
    uses: ./.github/workflows/staging-deploy.yml
    with:
      variant: lite
      license: lite
      project: conf-stg-lite
      environment: staging-lite
      ref: ${{ needs.target.outputs.sha }}
      workflow-ref: ${{ needs.target.outputs.tooling-sha }}
      skip-migrations: true
      preparation-mode: baseline
      benchmark-sample: baseline-1
    secrets: inherit

  candidate-1:
    name: candidate-1
    needs: [baseline-1, target]
    uses: ./.github/workflows/staging-deploy.yml
    with:
      variant: lite
      license: lite
      project: conf-stg-lite
      environment: staging-lite
      ref: ${{ needs.target.outputs.sha }}
      workflow-ref: ${{ needs.target.outputs.tooling-sha }}
      skip-migrations: true
      preparation-mode: candidate
      benchmark-sample: candidate-1
    secrets: inherit

  candidate-2:
    name: candidate-2
    needs: [candidate-1, target]
    if: needs.target.outputs.pairs == '3'
    uses: ./.github/workflows/staging-deploy.yml
    with:
      variant: lite
      license: lite
      project: conf-stg-lite
      environment: staging-lite
      ref: ${{ needs.target.outputs.sha }}
      workflow-ref: ${{ needs.target.outputs.tooling-sha }}
      skip-migrations: true
      preparation-mode: candidate
      benchmark-sample: candidate-2
    secrets: inherit

  baseline-2:
    name: baseline-2
    needs: [candidate-2, target]
    if: needs.target.outputs.pairs == '3'
    uses: ./.github/workflows/staging-deploy.yml
    with:
      variant: lite
      license: lite
      project: conf-stg-lite
      environment: staging-lite
      ref: ${{ needs.target.outputs.sha }}
      workflow-ref: ${{ needs.target.outputs.tooling-sha }}
      skip-migrations: true
      preparation-mode: baseline
      benchmark-sample: baseline-2
    secrets: inherit

  baseline-3:
    name: baseline-3
    needs: [baseline-2, target]
    if: needs.target.outputs.pairs == '3'
    uses: ./.github/workflows/staging-deploy.yml
    with:
      variant: lite
      license: lite
      project: conf-stg-lite
      environment: staging-lite
      ref: ${{ needs.target.outputs.sha }}
      workflow-ref: ${{ needs.target.outputs.tooling-sha }}
      skip-migrations: true
      preparation-mode: baseline
      benchmark-sample: baseline-3
    secrets: inherit

  candidate-3:
    name: candidate-3
    needs: [baseline-3, target]
    if: needs.target.outputs.pairs == '3'
    uses: ./.github/workflows/staging-deploy.yml
    with:
      variant: lite
      license: lite
      project: conf-stg-lite
      environment: staging-lite
      ref: ${{ needs.target.outputs.sha }}
      workflow-ref: ${{ needs.target.outputs.tooling-sha }}
      skip-migrations: true
      preparation-mode: candidate
      benchmark-sample: candidate-3
    secrets: inherit

  report:
    needs: [target, migrations, baseline-1, candidate-1, candidate-2, baseline-2, baseline-3, candidate-3]
    if: ${{ !cancelled() && needs.baseline-1.result == 'success' && needs.candidate-1.result == 'success' && (needs.target.outputs.pairs == '1' || (needs.candidate-2.result == 'success' && needs.baseline-2.result == 'success' && needs.baseline-3.result == 'success' && needs.candidate-3.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.tooling-sha }}
      - uses: actions/download-artifact@v7
        with:
          pattern: lite-deploy-*
          path: benchmark-evidence
      - name: Compare complete deployment jobs
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_PAIRS: ${{ needs.target.outputs.pairs }}
        run: node scripts/ci/lite-deploy-report.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: lite-deploy-benchmark-report
          path: lite-deploy-benchmark.json
          retention-days: 30
