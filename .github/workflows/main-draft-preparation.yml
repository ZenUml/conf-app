name: Draft preparation
on:
  # Called by build-test-deploy.yml: every phase runs inside the root run.
  workflow_call:
    inputs:
      source-sha: {type: string, required: true}
      version: {type: string, required: true}
permissions:
  contents: read
  actions: read
jobs:
  parent:
    name: Read root options
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      run: ${{ steps.owner.outputs.run }}
      gate-allowed: ${{ steps.regression.outputs.allowed }}
      gate-reason: ${{ steps.regression.outputs.gate-reason }}
      regression-run-url: ${{ steps.regression.outputs.regression-run-url }}
      bypass-reason: ${{ steps.regression.outputs.bypass-reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}
          # Full commit history for `git merge-base --is-ancestor` and the
          # baseline diff, without every old file body: a blobless clone took
          # 6.7 s against 11.0 s for the full clone (2026-11-22, local), and
          # this job gates the deploys and the drafts.
          fetch-depth: 0
          filter: blob:none
      - name: Read this attempt's root options
        id: owner
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: node scripts/ci/wait-for-e2e.mjs --root-options
      - name: Require fresh successful daily regression for drafts
        id: regression
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { randomUUID } from 'node:crypto';
          const options = JSON.parse(readFileSync('verified-root-options.json', 'utf8'));
          const gate = JSON.parse(execFileSync(process.execPath, ['scripts/test-selection/main-policy.mjs', '--gate'], {
            encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'], env: { ...process.env, ROOT_EVENT: options.root_event,
              BYPASS_REGRESSION_GATE: String(options.bypass_regression_gate), BYPASS_REASON: options.bypass_reason },
          }));
          writeFileSync('daily-gate.json', JSON.stringify({ ...gate, source_sha: options.source_sha, root_run_id: options.root_run_id, root_attempt: options.root_attempt, producer_run_id: process.env.GITHUB_RUN_ID, bypass_reason: options.bypass_regression_gate ? options.bypass_reason : '' }));
          const delimiter = randomUUID();
          appendFileSync(process.env.GITHUB_OUTPUT, `bypass-reason<<${delimiter}\n${options.bypass_regression_gate ? options.bypass_reason : 'none'}\n${delimiter}\n`);
          if (options.bypass_regression_gate) appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Daily gate bypass reason for this root: ${options.bypass_reason}\n`);
          NODE
      - uses: actions/upload-artifact@v6
        with:
          # Attempt suffix: the outcome job reads it by name with `gh run download`,
          # and a partial rerun keeps the earlier attempt's artifact in the run.
          name: daily-gate-${{ github.run_attempt }}
          path: daily-gate.json
          if-no-files-found: error
          retention-days: 30

  # Runs beside `parent`, not after it: it only reads the provenance artifacts
  # that the build and staging phases uploaded to this same root run.
  provenance:
    name: Resolve variant draft eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      lite: ${{ steps.eligibility.outputs.lite }}
      full: ${{ steps.eligibility.outputs.full }}
      diagramly: ${{ steps.eligibility.outputs.diagramly }}
      asyncapi: ${{ steps.eligibility.outputs.asyncapi }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: build-provenance
      - uses: actions/download-artifact@v7
        with:
          name: staging-provenance
      - name: Require matching source and successful variant prerequisites
        id: eligibility
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const evidence = JSON.parse(readFileSync('staging-provenance.json', 'utf8'));
          if (evidence.source_sha !== process.env.SOURCE_SHA) throw new Error('Staging source differs from draft source');
          const buildEvidence = JSON.parse(readFileSync('build-provenance.json', 'utf8'));
          if (buildEvidence.source_sha !== process.env.SOURCE_SHA) throw new Error('Build source differs from draft source');
          const buildReady = buildEvidence.results.build?.result === 'success' && buildEvidence.results['build-prod']?.result === 'success';
          const results = evidence.results;
          const success = name => results[name]?.result === 'success';
          const migrationsReady = success('migrations');
          const eligible = {
            lite: success('staging-lite') && success('staging-lite-e2e'),
            full: success('staging-full') && success('staging-full-e2e'),
            diagramly: success('staging-diagramly') && success('staging-diagramly-e2e'),
            asyncapi: success('staging-asyncapi') && success('staging-asyncapi-e2e'),
          };
          for (const [variant, ready] of Object.entries(eligible)) appendFileSync(process.env.GITHUB_OUTPUT, `${variant}=${buildReady && migrationsReady && ready}\n`);
          NODE

  draft-release-lite:
    name: "Draft: Lite"
    if: ${{ !cancelled() && needs.parent.result == 'success' && needs.parent.outputs.gate-allowed == 'true' && needs.provenance.result == 'success' && needs.provenance.outputs.lite == 'true' }}
    needs: [parent, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      repository-projects: write
    # No checkout: the draft needs only the downloaded bundle, and `commit:` pins the tag.
    steps:
      - name: Export Properties
        id: properties
        shell: bash
        run: echo "version=${{ inputs.version }}" >> $GITHUB_ENV
      - name: Download the production bundle built for this version
        uses: actions/download-artifact@v7
        with:
          name: dist-prod-lite

      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-lite
          name: v${{ env.version }}-lite
          artifacts: dist-prod-lite.tgz
          artifactErrorsFailBuild: true
          commit: ${{ inputs.source-sha }}
          body: |
            This is a draft release for the Lite version of the plugin.

            Daily regression gate: ${{ needs.parent.outputs.gate-reason }}
            Daily regression: ${{ needs.parent.outputs.regression-run-url }}
            Bypass reason: ${{ needs.parent.outputs.bypass-reason }}
            E2E: validated by staging run https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          draft: true

  draft-release-full:
    name: "Draft: Full"
    if: ${{ !cancelled() && needs.parent.result == 'success' && needs.parent.outputs.gate-allowed == 'true' && needs.provenance.result == 'success' && needs.provenance.outputs.full == 'true' }}
    needs: [parent, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      repository-projects: write
    # No checkout: the draft needs only the downloaded bundle, and `commit:` pins the tag.
    steps:
      - name: Export Properties
        id: properties
        shell: bash
        run: echo "version=${{ inputs.version }}" >> $GITHUB_ENV
      - name: Download the production bundle built for this version
        uses: actions/download-artifact@v7
        with:
          name: dist-prod-full

      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-full
          name: v${{ env.version }}-full
          artifacts: dist-prod-full.tgz
          artifactErrorsFailBuild: true
          commit: ${{ inputs.source-sha }}
          body: |
            This is a draft release for the Full version of the plugin.
            Daily regression gate: ${{ needs.parent.outputs.gate-reason }}
            Daily regression: ${{ needs.parent.outputs.regression-run-url }}
            Bypass reason: ${{ needs.parent.outputs.bypass-reason }}
          draft: true

  draft-release-diagramly:
    name: "Draft: Diagramly"
    if: ${{ !cancelled() && needs.parent.result == 'success' && needs.parent.outputs.gate-allowed == 'true' && needs.provenance.result == 'success' && needs.provenance.outputs.diagramly == 'true' }}
    needs: [parent, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      repository-projects: write
    # No checkout: the draft needs only the downloaded bundle, and `commit:` pins the tag.
    steps:
      - name: Export Properties
        id: properties
        shell: bash
        run: echo "version=${{ inputs.version }}" >> $GITHUB_ENV
      - name: Download the production bundle built for this version
        uses: actions/download-artifact@v7
        with:
          name: dist-prod-diagramly

      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-diagramly
          name: v${{ env.version }}-diagramly
          artifacts: dist-prod-diagramly.tgz
          artifactErrorsFailBuild: true
          commit: ${{ inputs.source-sha }}
          body: |
            This is a draft release for the Diagramly version of the plugin.
            Daily regression gate: ${{ needs.parent.outputs.gate-reason }}
            Daily regression: ${{ needs.parent.outputs.regression-run-url }}
            Bypass reason: ${{ needs.parent.outputs.bypass-reason }}
          draft: true

  draft-release-asyncapi:
    name: "Draft: AsyncAPI"
    if: ${{ !cancelled() && needs.parent.result == 'success' && needs.parent.outputs.gate-allowed == 'true' && needs.provenance.result == 'success' && needs.provenance.outputs.asyncapi == 'true' }}
    needs: [parent, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      repository-projects: write
    # No checkout: the draft needs only the downloaded bundle, and `commit:` pins the tag.
    steps:
      - name: Export Properties
        id: properties
        shell: bash
        run: echo "version=${{ inputs.version }}" >> $GITHUB_ENV
      - name: Download the production bundle built for this version
        uses: actions/download-artifact@v7
        with:
          name: dist-prod-asyncapi

      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-asyncapi
          name: v${{ env.version }}-asyncapi
          artifacts: dist-prod-asyncapi.tgz
          artifactErrorsFailBuild: true
          commit: ${{ inputs.source-sha }}
          body: |
            This is a draft release for the AsyncAPI variant of the plugin.
            Daily regression gate: ${{ needs.parent.outputs.gate-reason }}
            Daily regression: ${{ needs.parent.outputs.regression-run-url }}
            Bypass reason: ${{ needs.parent.outputs.bypass-reason }}
          draft: true


  outcome:
    name: Draft gate outcome
    needs: [parent, provenance, draft-release-lite, draft-release-full, draft-release-diagramly, draft-release-asyncapi]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          if (needs.parent.outputs['gate-allowed'] !== 'true' || Object.values(needs).some(value => value.result !== 'success')) process.exitCode = 1;
          NODE
