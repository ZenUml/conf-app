name: Draft preparation
run-name: "Draft preparation · parent ${{ inputs.parent-run-id }} · attempt ${{ inputs.parent-attempt }} · source ${{ inputs.source-sha }}"
on:
  workflow_dispatch:
    inputs:
      parent-run-id: {type: string, required: true}
      parent-attempt: {type: string, required: true}
      source-sha: {type: string, required: true}
      version: {type: string, required: true}
      artifact-run-id: {type: string, required: true}
      staging-run-id: {type: string, required: true}
permissions:
  contents: read
  actions: read
jobs:
  parent:
    name: Verify root ownership
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.owner.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}
      - name: Check the active root
        id: owner
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ inputs.parent-run-id }}
          PARENT_ATTEMPT: ${{ inputs.parent-attempt }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          EXPECTED_PARENT_JOBS: '["Draft preparation"]'
        run: |
          node scripts/ci/wait-for-e2e.mjs --verify-parent
          echo "run=true" >> "$GITHUB_OUTPUT"

  provenance:
    name: Resolve variant draft eligibility
    needs: parent
    runs-on: ubuntu-latest
    outputs:
      lite: ${{ steps.eligibility.outputs.lite }}
      full: ${{ steps.eligibility.outputs.full }}
      diagramly: ${{ steps.eligibility.outputs.diagramly }}
      asyncapi: ${{ steps.eligibility.outputs.asyncapi }}
      reuse: ${{ steps.eligibility.outputs.reuse }}
      run-url: ${{ steps.eligibility.outputs.run-url }}
    steps:
      - name: Verify immutable artifact producers
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.artifact-run-id }}
          STAGING_RUN_ID: ${{ inputs.staging-run-id }}
          PARENT_RUN_ID: ${{ inputs.parent-run-id }}
          PARENT_ATTEMPT: ${{ inputs.parent-attempt }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const env = process.env;
          const verify = (id, path, title, conclusions) => {
            const run = JSON.parse(execFileSync('gh', ['api', `repos/${env.GITHUB_REPOSITORY}/actions/runs/${id}`], { encoding: 'utf8' }));
            const expected = `${title} · parent ${env.PARENT_RUN_ID} · attempt ${env.PARENT_ATTEMPT} · source ${env.SOURCE_SHA}`;
            if (run.path !== `.github/workflows/${path}.yml` || run.display_title !== expected ||
                run.status !== 'completed' || run.run_attempt !== 1 || !conclusions.includes(run.conclusion)) {
              throw new Error(`Artifact producer does not match this root source and attempt: ${id}`);
            }
          };
          verify(env.BUILD_RUN_ID, 'main-build-preparation', 'Build preparation', ['success', 'failure']);
          verify(env.STAGING_RUN_ID, 'main-staging-validation', 'Staging validation', ['success', 'failure']);
          NODE
      - uses: actions/download-artifact@v7
        with:
          name: build-provenance
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          name: staging-provenance
          run-id: ${{ inputs.staging-run-id }}
          github-token: ${{ github.token }}
      - name: Require matching source and successful variant prerequisites
        id: eligibility
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const evidence = JSON.parse(readFileSync('staging-provenance.json', 'utf8'));
          if (evidence.source_sha !== process.env.SOURCE_SHA) throw new Error('Staging source differs from draft source');
          const buildEvidence = JSON.parse(readFileSync('build-provenance.json', 'utf8'));
          if (buildEvidence.source_sha !== process.env.SOURCE_SHA) throw new Error('Build source differs from draft source');
          const buildReady = buildEvidence.results.build?.result === 'success' && buildEvidence.results['build-prod']?.result === 'success';
          const results = evidence.results;
          const success = name => results[name]?.result === 'success';
          const reuse = results['reuse-check']?.outputs?.reuse === 'true';
          const eligible = {
            // Lite's deploy is two jobs (Forge + Pages backend); reused PR
            // coverage skips Lite E2E, so check both directly.
            lite: success('staging-lite') && success('backend-lite') && (reuse || success('staging-lite-e2e')),
            full: success('staging-full-e2e') || success('staging-full-e2e-now'),
            diagramly: success('staging-diagramly-e2e'),
            asyncapi: success('staging-asyncapi-e2e'),
          };
          for (const [variant, ready] of Object.entries(eligible)) appendFileSync(process.env.GITHUB_OUTPUT, `${variant}=${buildReady && ready}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reuse=${reuse}\nrun-url=${results['reuse-check']?.outputs?.['run-url'] || ''}\n`);
          NODE

  draft-release-lite:
    name: "Draft: Lite"
    # don't run on pull requests to avoid creating draft releases for pull requests
    # only run on the default branch, to avoid cutting releases from feature branches
    # `build` (unit tests + the asyncapi build check) gates the drafts here
    # rather than the E2E jobs — a draft is never cut from a commit whose unit
    # tests failed, but the E2E no longer waits for them (ADR-0006). The Lite
    # E2E is either this run's (both suites green) or a PR run's on the
    # identical tree (reuse-check said so and the suites skipped themselves) —
    # ADR-0007 §2. The staging deploy must have happened in THIS run either way.
    if: ${{ !cancelled() && needs.parent.result == 'success' && needs.provenance.outputs.lite == 'true' }}
    needs: [parent, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}

      - name: Export Properties
        id: properties
        shell: bash
        run: echo "version=${{ inputs.version }}" >> $GITHUB_ENV
      - name: Download the production bundle built for this version
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: dist-prod-lite

      # Create new release draft - which is not publicly visible and requires manual acceptance
      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-lite
          name: v${{ env.version }}-lite
          # The production bundle release.yml deploys (ADR-0007 §3).
          artifacts: dist-prod-lite.tgz
          artifactErrorsFailBuild: true
          # Pin the draft to the commit this build tested. Without `commit`,
          # target_commitish defaults to the `main` BRANCH and is resolved when
          # the draft is published — so a draft published after a later merge
          # ships that newer commit instead, under this build's version number.
          commit: ${{ inputs.source-sha }}
          # Provenance: which run's E2E this draft rests on. The release-app
          # skill reads it when composing the notes.
          body: |
            This is a draft release for the Lite version of the plugin.

            E2E: ${{ needs.provenance.outputs.reuse == 'true' && format('reused from a PR run on the identical tree — {0}', needs.provenance.outputs.run-url) || format('validated by staging run https://github.com/{0}/actions/runs/{1}', github.repository, inputs.staging-run-id) }}
          draft: true

  draft-release-full:
    name: "Draft: Full"
    # Either Full E2E lane (see staging-full-e2e) may have run; the other is
    # skipped, which a plain `needs` would propagate. Require `build` and
    # whichever lane ran.
    if: ${{ !cancelled() && needs.parent.result == 'success' && needs.provenance.outputs.full == 'true' }}
    needs: [parent, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}

      - name: Export Properties
        id: properties
        shell: bash
        run: echo "version=${{ inputs.version }}" >> $GITHUB_ENV
      - name: Download the production bundle built for this version
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: dist-prod-full

      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-full
          name: v${{ env.version }}-full
          # The production bundle release.yml deploys (ADR-0007 §3).
          artifacts: dist-prod-full.tgz
          artifactErrorsFailBuild: true
          # See the Lite draft step: pins the draft to the tested commit.
          commit: ${{ inputs.source-sha }}
          body: 'This is a draft release for the Full version of the plugin.'
          draft: true

  draft-release-diagramly:
    name: "Draft: Diagramly"
    # don't run on pull requests to avoid creating draft releases for pull requests
    # only run on the default branch, to avoid cutting releases from feature branches
    if: ${{ !cancelled() && needs.parent.result == 'success' && needs.provenance.outputs.diagramly == 'true' }}
    needs: [parent, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}

      - name: Export Properties
        id: properties
        shell: bash
        run: echo "version=${{ inputs.version }}" >> $GITHUB_ENV
      - name: Download the production bundle built for this version
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: dist-prod-diagramly

      # Create new release draft - which is not publicly visible and requires manual acceptance
      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-diagramly
          name: v${{ env.version }}-diagramly
          # The production bundle release.yml deploys (ADR-0007 §3).
          artifacts: dist-prod-diagramly.tgz
          artifactErrorsFailBuild: true
          # See the Lite draft step: pins the draft to the tested commit.
          commit: ${{ inputs.source-sha }}
          body: 'This is a draft release for the Diagramly version of the plugin.'
          draft: true

  draft-release-asyncapi:
    name: "Draft: AsyncAPI"
    # Mirrors the lite/full/diagramly drafts. Production release.yml does not
    # yet handle the `asyncapi` variant — when it does, an `asyncapi` tag
    # published from this draft will trigger the prod deploy automatically.
    # Until then the draft is a no-op artifact (intentional: keeps the
    # release cadence aligned across variants).
    if: ${{ !cancelled() && needs.parent.result == 'success' && needs.provenance.outputs.asyncapi == 'true' }}
    needs: [parent, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}

      - name: Export Properties
        id: properties
        shell: bash
        run: echo "version=${{ inputs.version }}" >> $GITHUB_ENV
      - name: Download the production bundle built for this version
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: dist-prod-asyncapi

      - name: Create Release Draft
        id: createDraft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-asyncapi
          name: v${{ env.version }}-asyncapi
          # The production bundle release.yml deploys (ADR-0007 §3).
          artifacts: dist-prod-asyncapi.tgz
          artifactErrorsFailBuild: true
          # See the Lite draft step: pins the draft to the tested commit.
          commit: ${{ inputs.source-sha }}
          body: 'This is a draft release for the AsyncAPI variant of the plugin.'
          draft: true

