name: Staging validation
on:
  # Called by build-test-deploy.yml: every phase runs inside the root run.
  workflow_call:
    inputs:
      source-sha: {type: string, required: true}
      version: {type: string, required: true}
permissions:
  contents: read
  actions: read
jobs:
  parent:
    name: Read root options
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      run: ${{ steps.owner.outputs.run }}
      grep: ${{ steps.selection.outputs.grep }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}
          # Full commit history for `git merge-base --is-ancestor` and the
          # baseline diff, without every old file body: a blobless clone took
          # 6.7 s against 11.0 s for the full clone (2026-11-22, local), and
          # this job gates the deploys and the drafts.
          fetch-depth: 0
          filter: blob:none
      - name: Read this attempt's root options
        id: owner
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: node scripts/ci/wait-for-e2e.mjs --root-options
      - name: Find previous successful main validation
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          ROOT_RUN_ID: ${{ github.run_id }}
        run: node scripts/test-selection/main-policy.mjs --baseline
      - name: Classify and resolve main coverage
        id: selection
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          CANDIDATE: ${{ inputs.source-sha }}
          BASE_SHA: ${{ steps.baseline.outputs.base-sha }}
          FORCE_FULL: ${{ steps.baseline.outputs.force-full }}
          FULL_TESTS: ${{ steps.owner.outputs.full-tests }}
          SELECTION_SCOPE: main
        run: |
          set -euo pipefail
          HUMAN_FULL=false
          if [ "$FORCE_FULL" = true ] || [ "$FULL_TESTS" = true ]; then HUMAN_FULL=true; fi
          if [ -n "$BASE_SHA" ]; then
            if ! git diff --name-only "$BASE_SHA" "$CANDIDATE" > changed-files.txt; then HUMAN_FULL=true; : > changed-files.txt; fi
          else
            touch changed-files.txt
          fi
          export HUMAN_FULL
          node scripts/test-selection/classify.mjs --base "${BASE_SHA:-$CANDIDATE}" --head "$CANDIDATE" --scope main --human-full "$HUMAN_FULL" --mode enabled --output test-selection.json
          export CANDIDATE_TREE=$(git rev-parse "$CANDIDATE^{tree}")
          export SELECTION_PATH=test-selection.json
          node scripts/test-selection/resolve.mjs > selection.json
          printf '\n### Main coverage\n' >> "$GITHUB_STEP_SUMMARY"
          cat selection.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Run workflow: Actions → Build, Test and Draft Release → Run workflow → main. full-tests forces complete suites; bypass-regression-gate with bypass-reason affects drafts only.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: test-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-selection.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-selection-${{ github.run_id }}
          path: |
            selection.json
            changed-files.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: main-test-selection
          path: |
            test-selection.json
            selection.json
            changed-files.txt
          if-no-files-found: error

  e2e-auth-lite:
    needs: parent
    if: ${{ needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    name: "E2E auth: Lite"
    uses: ./.github/workflows/e2e-auth.yml
    with:
      app: zenuml-lite@stg
      artifact-name: auth-state-pre-lite-stg
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  e2e-auth-full:
    needs: parent
    if: ${{ needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    name: "E2E auth: Full"
    uses: ./.github/workflows/e2e-auth.yml
    with:
      app: zenuml-full@stg
      artifact-name: auth-state-pre-full-stg
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  e2e-auth-diagramly:
    needs: parent
    if: ${{ needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    name: "E2E auth: Diagramly"
    uses: ./.github/workflows/e2e-auth.yml
    with:
      app: diagramly@stg
      artifact-name: auth-state-pre-diagramly-stg
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  e2e-auth-asyncapi:
    needs: parent
    if: ${{ needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    name: "E2E auth: AsyncAPI"
    uses: ./.github/workflows/e2e-auth.yml
    with:
      app: asyncapi@stg
      artifact-name: auth-state-pre-asyncapi-stg
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  # All staging projects share the same D1 binding. Apply migrations once,
  # then each variant publishes its backend and deploys Forge independently.
  migrations:
    name: Shared staging D1 migrations
    needs: parent
    if: ${{ !cancelled() && needs.parent.result == 'success' && needs.parent.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-lite
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          # This job installs nothing; wrangler alone comes through npx.
          package-manager-cache: false
      - name: Apply shared staging D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ci/staging-d1-migrations.sh

  staging-lite:
    if: ${{ !cancelled() && needs.parent.result == 'success' && needs.parent.outputs.run == 'true' && needs.migrations.result == 'success' }}
    needs: [parent, migrations]
    name: "Deploy: Lite"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      ref: ${{ inputs.source-sha }}
      skip-migrations: true
      variant: lite
      license: lite
      project: conf-stg-lite
      environment: staging-lite
    secrets: inherit

  staging-lite-e2e:
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.parent.result == 'success' && needs.parent.outputs.run == 'true' && ((github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && needs.staging-lite.result == 'success' && needs.e2e-auth-lite.result == 'success') }}
    needs: [staging-lite, e2e-auth-lite, parent]
    name: "Validate: Lite"
    # Called, not dispatched: the E2E jobs run in this run (shown as
    # "Validate: Lite / ..."), which saves the run dispatch, polling and the
    # child's parent-ownership check. The child verifies the backend first.
    uses: ./.github/workflows/staging-lite-e2e.yml
    with:
      source-sha: ${{ inputs.source-sha }}
      grep: ${{ needs.parent.outputs.grep }}

  staging-full:
    needs: [parent, migrations]
    if: ${{ !cancelled() && needs.parent.result == 'success' && needs.parent.outputs.run == 'true' && needs.migrations.result == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    name: "Deploy: Full"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      ref: ${{ inputs.source-sha }}
      skip-migrations: true
      variant: full
      license: full
      project: conf-stg-full
      environment: staging-full
    secrets: inherit

  staging-full-e2e:
    if: ${{ !cancelled() && needs.parent.result == 'success' && needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.staging-full.result == 'success' && needs.e2e-auth-full.result == 'success') }}
    needs: [staging-full, e2e-auth-full, parent]
    name: "Validate: Full"
    # Called, not dispatched: the E2E jobs run in this run (shown as
    # "Validate: Full / ..."), which saves the run dispatch, polling and the
    # child's parent-ownership check. The child verifies the backend first.
    uses: ./.github/workflows/staging-full-e2e.yml
    with:
      source-sha: ${{ inputs.source-sha }}
      grep: ${{ needs.parent.outputs.grep }}
  # Lite, Diagramly and AsyncAPI use the same backend source at this SHA.
  staging-diagramly:
    needs: [parent, migrations]
    if: ${{ !cancelled() && needs.parent.result == 'success' && needs.parent.outputs.run == 'true' && needs.migrations.result == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    name: "Deploy: Diagramly"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      ref: ${{ inputs.source-sha }}
      skip-migrations: true
      variant: diagramly
      license: diagramly
      project: conf-stg-lite
      environment: staging-diagramly
    secrets: inherit

  staging-asyncapi:
    needs: [parent, migrations]
    if: ${{ !cancelled() && needs.parent.result == 'success' && needs.parent.outputs.run == 'true' && needs.migrations.result == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    name: "Deploy: AsyncAPI"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      ref: ${{ inputs.source-sha }}
      skip-migrations: true
      variant: asyncapi
      license: asyncapi
      project: conf-stg-lite
      environment: staging-asyncapi
    secrets: inherit

  staging-asyncapi-e2e:
    if: ${{ !cancelled() && needs.staging-asyncapi.result == 'success' && needs.e2e-auth-asyncapi.result == 'success' && needs.parent.result == 'success' && needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !(github.event_name == 'pull_request' && github.event.pull_request.draft == true)) }}
    needs: [staging-asyncapi, e2e-auth-asyncapi, parent]
    name: "Validate: AsyncAPI"
    # Called, not dispatched: the E2E jobs run in this run (shown as
    # "Validate: AsyncAPI / ..."), which saves the run dispatch, polling and the
    # child's parent-ownership check. The child verifies the backend first.
    uses: ./.github/workflows/staging-asyncapi-e2e.yml
    with:
      source-sha: ${{ inputs.source-sha }}
      grep: ${{ needs.parent.outputs.grep }}

  staging-diagramly-e2e:
    if: ${{ !cancelled() && needs.staging-diagramly.result == 'success' && needs.e2e-auth-diagramly.result == 'success' && needs.parent.result == 'success' && needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    needs: [staging-diagramly, e2e-auth-diagramly, parent]
    name: "Validate: Diagramly"
    # Called, not dispatched: the E2E jobs run in this run (shown as
    # "Validate: Diagramly / ..."), which saves the run dispatch, polling and the
    # child's parent-ownership check. The child verifies the backend first.
    uses: ./.github/workflows/staging-diagramly-e2e.yml
    with:
      source-sha: ${{ inputs.source-sha }}
      grep: ${{ needs.parent.outputs.grep }}

  provenance:
    name: Record variant validation results
    needs: [parent, migrations, staging-lite, staging-full, staging-diagramly, staging-asyncapi, staging-lite-e2e, staging-full-e2e, staging-diagramly-e2e, staging-asyncapi-e2e]
    if: ${{ always() && needs.parent.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record immutable source and direct validation results
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -n --arg source "$SOURCE_SHA" --argjson results "$RESULTS" '{source_sha: $source, results: $results}' > staging-provenance.json
      - uses: actions/upload-artifact@v6
        with:
          name: staging-provenance
          path: staging-provenance.json
          if-no-files-found: error
          retention-days: 30
