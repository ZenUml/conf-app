name: Staging validation
run-name: "Staging validation · parent ${{ inputs.parent-run-id }} · attempt ${{ inputs.parent-attempt }} · source ${{ inputs.source-sha }}"
on:
  workflow_dispatch:
    inputs:
      parent-run-id: {type: string, required: true}
      parent-attempt: {type: string, required: true}
      source-sha: {type: string, required: true}
      version: {type: string, required: true}
permissions:
  contents: read
  actions: read
jobs:
  parent:
    name: Verify root ownership
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.owner.outputs.run }}
      full-now: ${{ steps.lane.outputs.full-now }}
      grep: ${{ steps.selection.outputs.grep }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
      - name: Check the active root
        id: owner
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ inputs.parent-run-id }}
          PARENT_ATTEMPT: ${{ inputs.parent-attempt }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          EXPECTED_PARENT_JOBS: '["Staging validation"]'
        run: |
          node scripts/ci/wait-for-e2e.mjs --verify-parent
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Find previous successful main validation
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          ROOT_RUN_ID: ${{ inputs.parent-run-id }}
        run: node scripts/test-selection/main-policy.mjs --baseline
      - name: Classify and resolve main coverage
        id: selection
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          CANDIDATE: ${{ inputs.source-sha }}
          BASE_SHA: ${{ steps.baseline.outputs.base-sha }}
          FORCE_FULL: ${{ steps.baseline.outputs.force-full }}
          FULL_TESTS: ${{ steps.owner.outputs.full-tests }}
          SELECTION_SCOPE: main
        run: |
          set -euo pipefail
          HUMAN_FULL=false
          if [ "$FORCE_FULL" = true ] || [ "$FULL_TESTS" = true ]; then HUMAN_FULL=true; fi
          export HUMAN_FULL
          node scripts/test-selection/classify.mjs --base "${BASE_SHA:-$CANDIDATE}" --head "$CANDIDATE" --scope main --human-full "$HUMAN_FULL" --mode enabled --output test-selection.json
          if [ -n "$BASE_SHA" ]; then git diff --name-only "$BASE_SHA" "$CANDIDATE" > changed-files.txt; else touch changed-files.txt; fi
          export CANDIDATE_TREE=$(git rev-parse "$CANDIDATE^{tree}")
          export SELECTION_PATH=test-selection.json
          node scripts/test-selection/resolve.mjs > selection.json
          printf '\n### Main coverage\n' >> "$GITHUB_STEP_SUMMARY"
          cat selection.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Run workflow: Actions → Build, Test and Draft Release → Run workflow → main. full-tests forces complete suites; bypass-regression-gate with bypass-reason affects drafts only.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: test-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-selection.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-selection-${{ github.run_id }}
          path: |
            selection.json
            changed-files.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: main-test-selection
          path: |
            test-selection.json
            selection.json
            changed-files.txt
          if-no-files-found: error
      - name: Resolve Full validation lane from the pinned commit
        id: lane
        env:
          FULL_DRAFT_LANE: ${{ vars.FULL_DRAFT_LANE }}
        run: |
          FULL_NOW=false
          if [ "$FULL_DRAFT_LANE" = now ] || git log -1 --format=%B | rg -q -F '[full-first]'; then FULL_NOW=true; fi
          echo "full-now=$FULL_NOW" >> "$GITHUB_OUTPUT"

  e2e-auth-lite:
    needs: parent
    if: ${{ needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    name: "E2E auth: Lite"
    uses: ./.github/workflows/e2e-auth.yml
    with:
      app: zenuml-lite@stg
      artifact-name: auth-state-pre-lite-stg
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  e2e-auth-full:
    needs: parent
    if: ${{ needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    name: "E2E auth: Full"
    uses: ./.github/workflows/e2e-auth.yml
    with:
      app: zenuml-full@stg
      artifact-name: auth-state-pre-full-stg
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  e2e-auth-diagramly:
    needs: parent
    if: ${{ needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    name: "E2E auth: Diagramly"
    uses: ./.github/workflows/e2e-auth.yml
    with:
      app: diagramly@stg
      artifact-name: auth-state-pre-diagramly-stg
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  e2e-auth-asyncapi:
    needs: parent
    if: ${{ needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    name: "E2E auth: AsyncAPI"
    uses: ./.github/workflows/e2e-auth.yml
    with:
      app: asyncapi@stg
      artifact-name: auth-state-pre-asyncapi-stg
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  staging-lite:
    if: needs.parent.outputs.run == 'true'
    needs: parent
    name: "Deploy: Lite"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      ref: ${{ inputs.source-sha }}
      variant: lite
      license: lite
      project: conf-stg-lite
      environment: staging-lite
    secrets: inherit

  staging-lite-e2e:
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.parent.outputs.run == 'true' && ((github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && needs.staging-lite.result == 'success' && needs.e2e-auth-lite.result == 'success') }}
    needs: [staging-lite, e2e-auth-lite, parent]
    name: "Validate: Lite"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}
      - name: Run E2E in a separate graph
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: staging-lite-e2e.yml
          CHILD_TITLE: staging-lite-e2e
          SOURCE_SHA: ${{ inputs.source-sha }}
          ROOT_RUN_ID: ${{ inputs.parent-run-id }}
          ROOT_ATTEMPT: ${{ inputs.parent-attempt }}
          GREP: ${{ needs.parent.outputs.grep }}
          SUITE: regression
          TEST_TIMEOUT: '35'
          WAIT_MINUTES: '60'
        run: node scripts/ci/wait-for-e2e.mjs
      - name: Close any active child run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: staging-lite-e2e.yml
          CHILD_TITLE: staging-lite-e2e
          SOURCE_SHA: ${{ inputs.source-sha }}
          ROOT_RUN_ID: ${{ inputs.parent-run-id }}
          ROOT_ATTEMPT: ${{ inputs.parent-attempt }}
        run: node scripts/ci/wait-for-e2e.mjs --cleanup

  staging-full:
    needs: parent
    if: ${{ needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    name: "Deploy: Full"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      ref: ${{ inputs.source-sha }}
      variant: full
      license: full
      project: conf-stg-full
      environment: staging-full
    secrets: inherit

  staging-full-e2e:
    if: ${{ !cancelled() && needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !(needs.parent.outputs.full-now == 'true') && needs.staging-full.result == 'success' && needs.e2e-auth-full.result == 'success') }}
    needs: [staging-full, e2e-auth-full, staging-lite-e2e, parent]
    name: "Validate: Full"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}
      - name: Run E2E in a separate graph
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: staging-full-e2e.yml
          CHILD_TITLE: staging-full-e2e
          SOURCE_SHA: ${{ inputs.source-sha }}
          ROOT_RUN_ID: ${{ inputs.parent-run-id }}
          ROOT_ATTEMPT: ${{ inputs.parent-attempt }}
          GREP: ${{ needs.parent.outputs.grep }}
          SUITE: regression
          TEST_TIMEOUT: '35'
          WAIT_MINUTES: '60'
        run: node scripts/ci/wait-for-e2e.mjs
      - name: Close any active child run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: staging-full-e2e.yml
          CHILD_TITLE: staging-full-e2e
          SOURCE_SHA: ${{ inputs.source-sha }}
          ROOT_RUN_ID: ${{ inputs.parent-run-id }}
          ROOT_ATTEMPT: ${{ inputs.parent-attempt }}
        run: node scripts/ci/wait-for-e2e.mjs --cleanup

  staging-full-e2e-now:
    if: ${{ !cancelled() && needs.staging-full.result == 'success' && needs.e2e-auth-full.result == 'success' && needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (needs.parent.outputs.full-now == 'true')) }}
    needs: [staging-full, e2e-auth-full, parent]
    name: "Validate: Full (now)"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}
      - name: Run E2E in a separate graph
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: staging-full-e2e.yml
          CHILD_TITLE: staging-full-e2e
          SOURCE_SHA: ${{ inputs.source-sha }}
          ROOT_RUN_ID: ${{ inputs.parent-run-id }}
          ROOT_ATTEMPT: ${{ inputs.parent-attempt }}
          GREP: ${{ needs.parent.outputs.grep }}
          SUITE: regression
          TEST_TIMEOUT: '35'
          WAIT_MINUTES: '60'
        run: node scripts/ci/wait-for-e2e.mjs
      - name: Close any active child run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: staging-full-e2e.yml
          CHILD_TITLE: staging-full-e2e
          SOURCE_SHA: ${{ inputs.source-sha }}
          ROOT_RUN_ID: ${{ inputs.parent-run-id }}
          ROOT_ATTEMPT: ${{ inputs.parent-attempt }}
        run: node scripts/ci/wait-for-e2e.mjs --cleanup

  # Shared Lite backend: validate Lite before deploying Diagramly, then AsyncAPI.
  staging-diagramly:
    needs: [staging-lite, staging-lite-e2e, parent]
    if: ${{ !cancelled() && needs.parent.outputs.run == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.staging-lite.result == 'success' && needs.staging-lite-e2e.result == 'success' }}
    name: "Deploy: Diagramly"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      ref: ${{ inputs.source-sha }}
      variant: diagramly
      license: diagramly
      project: conf-stg-lite
      environment: staging-diagramly
    secrets: inherit

  staging-asyncapi:
    needs: [staging-diagramly, staging-diagramly-e2e, parent]
    if: ${{ !cancelled() && needs.staging-diagramly.result == 'success' && needs.staging-diagramly-e2e.result == 'success' && needs.parent.result == 'success' && needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    name: "Deploy: AsyncAPI"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      ref: ${{ inputs.source-sha }}
      variant: asyncapi
      license: asyncapi
      project: conf-stg-lite
      environment: staging-asyncapi
    secrets: inherit

  staging-asyncapi-e2e:
    if: ${{ !cancelled() && needs.staging-asyncapi.result == 'success' && needs.e2e-auth-asyncapi.result == 'success' && needs.parent.result == 'success' && needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !(github.event_name == 'pull_request' && github.event.pull_request.draft == true)) }}
    needs: [staging-asyncapi, e2e-auth-asyncapi, parent]
    name: "Validate: AsyncAPI"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}
      - name: Run E2E in a separate graph
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: staging-asyncapi-e2e.yml
          CHILD_TITLE: staging-asyncapi-e2e
          SOURCE_SHA: ${{ inputs.source-sha }}
          ROOT_RUN_ID: ${{ inputs.parent-run-id }}
          ROOT_ATTEMPT: ${{ inputs.parent-attempt }}
          GREP: ${{ needs.parent.outputs.grep }}
          SUITE: regression
          TEST_TIMEOUT: '35'
          WAIT_MINUTES: '60'
        run: node scripts/ci/wait-for-e2e.mjs
      - name: Close any active child run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: staging-asyncapi-e2e.yml
          CHILD_TITLE: staging-asyncapi-e2e
          SOURCE_SHA: ${{ inputs.source-sha }}
          ROOT_RUN_ID: ${{ inputs.parent-run-id }}
          ROOT_ATTEMPT: ${{ inputs.parent-attempt }}
        run: node scripts/ci/wait-for-e2e.mjs --cleanup

  staging-diagramly-e2e:
    if: ${{ !cancelled() && needs.staging-diagramly.result == 'success' && needs.e2e-auth-diagramly.result == 'success' && needs.parent.result == 'success' && needs.parent.outputs.run == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    needs: [staging-diagramly, e2e-auth-diagramly, parent]
    name: "Validate: Diagramly"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}
      - name: Run E2E in a separate graph
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: staging-diagramly-e2e.yml
          CHILD_TITLE: staging-diagramly-e2e
          SOURCE_SHA: ${{ inputs.source-sha }}
          ROOT_RUN_ID: ${{ inputs.parent-run-id }}
          ROOT_ATTEMPT: ${{ inputs.parent-attempt }}
          GREP: ${{ needs.parent.outputs.grep }}
          SUITE: regression
          TEST_TIMEOUT: '35'
          WAIT_MINUTES: '60'
        run: node scripts/ci/wait-for-e2e.mjs
      - name: Close any active child run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: staging-diagramly-e2e.yml
          CHILD_TITLE: staging-diagramly-e2e
          SOURCE_SHA: ${{ inputs.source-sha }}
          ROOT_RUN_ID: ${{ inputs.parent-run-id }}
          ROOT_ATTEMPT: ${{ inputs.parent-attempt }}
        run: node scripts/ci/wait-for-e2e.mjs --cleanup


  provenance:
    name: Record variant validation results
    needs: [parent, staging-lite, staging-lite-e2e, staging-full-e2e, staging-full-e2e-now, staging-diagramly-e2e, staging-asyncapi-e2e]
    if: ${{ always() && needs.parent.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record immutable source and direct validation results
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -n --arg source "$SOURCE_SHA" --argjson results "$RESULTS" '{source_sha: $source, results: $results}' > staging-provenance.json
      - uses: actions/upload-artifact@v6
        with:
          name: staging-provenance
          path: staging-provenance.json
          if-no-files-found: error
          retention-days: 30
