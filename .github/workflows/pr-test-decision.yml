name: PR test decision

on:
  # Every PR gets an early state, including docs-only and external PRs.
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: pr-test-decision-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  decision:
    if: ${{ github.event_name == 'pull_request_target' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # Privileged metadata controller: only trusted default-branch code.
          # Never check out a PR or execute its scripts in this workflow.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Synchronize labels, Draft state and commit check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          PUBLISH_CHECK: 'true'
        run: node scripts/test-selection/pr-decision.mjs sync --pr "$PR"
