name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

  workflow_dispatch:
    inputs:
      pr-number:
        type: string
        required: true

# Only jobs that need staging belong here: this lock holds back the whole run.
# Unit tests, the AsyncAPI build and the Viewer preview are in pr-checks.yml.
concurrency:
  group: conf-app-staging
  cancel-in-progress: false
  queue: max

jobs:
  gate:
    name: Select authoritative event
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'test:run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run == 'true' && steps.current.outputs.current != 'false' }}
      candidate: ${{ steps.gate.outputs.candidate }}
      pr-number: ${{ steps.gate.outputs.pr-number }}
    steps:
      - uses: actions/checkout@v5
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR: ${{ github.event.pull_request.number || inputs.pr-number }}
          EVENT_CANDIDATE: ${{ github.sha }}
        run: |
          SHOULD_RUN=true
          if [ "$EVENT" = push ] && [ "$BRANCH" != "$DEFAULT_BRANCH" ]; then
            COUNT=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq "[.[] | select(.head.ref == env.BRANCH)] | length")
            [ "$COUNT" = 0 ] || SHOULD_RUN=false
          fi
          [[ "$PR" =~ ^[1-9][0-9]*$ ]]
          PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          [ "$(jq -r .state <<<"$PR_JSON")" = open ]
          CANDIDATE=$(jq -r .merge_commit_sha <<<"$PR_JSON")
          if [ "$EVENT" = pull_request ]; then CANDIDATE="$EVENT_CANDIDATE"; fi
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "pr-number=$PR" >> "$GITHUB_OUTPUT"
          echo "run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
      # This job starts once the run holds the staging lock, which can be many
      # minutes after the push. A run that a newer push overtook must not spend
      # the shared slot on a commit nobody will merge. `concurrency` cannot do
      # this for us: the group is repo-wide, so cancel-in-progress would cancel
      # other PRs, main and the daily regression too.
      - id: current
        name: Skip if a newer push overtook this run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/pr-head-current.mjs

      - name: Record parent candidate provenance
        env:
          PR: ${{ steps.gate.outputs.pr-number }}
          CANDIDATE: ${{ steps.gate.outputs.candidate }}
        run: |
          jq -n --arg pr "$PR" --arg candidate "$CANDIDATE" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '{pr: $pr, candidate: $candidate, run: $run, attempt: $attempt}' > pr-parent-provenance.json
      - uses: actions/upload-artifact@v6
        with:
          name: pr-parent-provenance-${{ github.run_attempt }}
          path: pr-parent-provenance.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Atlassian logins at t=0, one per staging site, so the E2E suites below start
  # the moment their deploy is live instead of queueing for a bootstrap behind it.
  # Measured on main run 34602804979 (2026-09-11): Deploy: Lite finished at
  # 5m20s, but E2E: Lite's first shard only started at 7m18s — the bootstrap
  # waited 78s on the repo-wide `e2e-auth` group (behind render's and DrawIO
  # Publish's) and then ran for 36s. The session does not depend on which build
  # is on the site, so the login can run under the deploy instead of after it.
  # Each suite passes its site's artifact as `auth-artifact`, which makes
  # e2e-test.yml skip its own bootstrap.
  #
  # One job per site rather than one matrix job: a `needs` on a matrix job
  # aggregates its legs, so an asyncapi-stg login flake would have skipped every
  # Lite shard. Per-site jobs keep the blast radius to the site that failed.
  # Authentication only starts after a current decision has been authorized.
  e2e-auth-lite:
    needs: [gate, select]
    if: ${{ needs.select.result == 'success' && needs.gate.outputs.run == 'true' }}
    name: "E2E auth: Lite"
    uses: ./.github/workflows/e2e-auth.yml
    with:
      app: zenuml-lite@stg
      artifact-name: auth-state-pre-lite-stg
    # Creds via `secrets:` (GitHub masks them as ***), not `with:` (echoed in logs).
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  select:
    needs: gate
    name: "Select E2E for this PR"
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      grep: ${{ steps.select.outputs.grep }}
      decision-id: ${{ steps.select.outputs.decision-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Never execute candidate selection code with the controller token.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Authorize the current commit's test decision
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.pr-number }}
          CANDIDATE: ${{ needs.gate.outputs.candidate }}
        run: |
          node scripts/test-selection/pr-decision.mjs check --pr "$PR" --candidate "$CANDIDATE"
      - uses: actions/upload-artifact@v6
        with:
          name: test-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-selection.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-selection-${{ github.run_id }}
          path: |
            selection.json
            changed-files.txt
          if-no-files-found: error
          retention-days: 30

  staging-lite:
    if: needs.gate.outputs.run == 'true'
    needs: gate
    name: "Deploy: Lite"
    uses: ./.github/workflows/staging-deploy.yml
    with:
      ref: ${{ needs.gate.outputs.candidate }}
      variant: lite
      license: lite
      project: conf-stg-lite
      environment: staging-lite
    secrets: inherit

  pr-e2e-validation:
    name: "E2E validation"
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || inputs.pr-number != '') && needs.gate.outputs.run == 'true' && needs.staging-lite.result == 'success' && needs.select.result == 'success' && needs.e2e-auth-lite.result == 'success' }}
    needs: [gate, staging-lite, select, e2e-auth-lite]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      # The deploy before this step takes minutes, and it is never cancelled: a
      # half-finished staging deploy is worse than a stale one. Check again here
      # so a push during the deploy skips the E2E run. An E2E run already under
      # way finishes, because stopping it mid-shard saves little and leaves
      # staging in an unknown state for the next owner.
      - id: current
        name: Skip if a newer push overtook this run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/pr-head-current.mjs
      - name: Dispatch and wait for E2E
        if: ${{ !cancelled() && steps.current.outputs.current != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: pr-agent-e2e-validation.yml
          CHILD_TITLE: PR E2E
          CHILD_KIND: pr
          DISPATCH_REF: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ needs.gate.outputs.candidate }}
          PR_NUMBER: ${{ needs.gate.outputs.pr-number }}
          DECISION_ID: ${{ needs.select.outputs.decision-id }}
          MODE: ${{ needs.select.outputs.mode }}
          GREP: ${{ needs.select.outputs.grep }}
        run: node scripts/ci/wait-for-e2e.mjs
      - name: Close any active child run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: pr-agent-e2e-validation.yml
          CHILD_TITLE: PR E2E
          SOURCE_SHA: ${{ needs.gate.outputs.candidate }}
        run: node scripts/ci/wait-for-e2e.mjs --cleanup

  pr-pipeline-outcome:
    name: Pipeline outcome
    if: ${{ always() && needs.gate.outputs.run == 'true' }}
    needs: [gate, select, staging-lite, e2e-auth-lite, pr-e2e-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Report the pipeline result
        env:
          MODE: ${{ needs.select.outputs.mode }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const results = JSON.parse(process.env.RESULTS);
          const rows = Object.entries(results).map(([job, value]) => `| ${job} | ${value.result} |`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Pipeline outcome\n\nE2E selection: **${process.env.MODE || 'not resolved'}**. Open **E2E validation** for the child run link and shard details.\n\n| Stage | Result |\n|---|---|\n${rows.join('\n')}\n`);
          if (Object.values(results).some(value => ['failure', 'cancelled'].includes(value.result))) process.exitCode = 1;
          NODE
