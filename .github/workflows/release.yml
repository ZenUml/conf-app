# GitHub Actions Workflow created for handling the release process based on the draft release prepared
# with the Build workflow. Running the publishPlugin task requires the PUBLISH_TOKEN secret provided.

name: Release
on:
  release:
    types: [prereleased, released]

jobs:
  release:
    name: ${{ github.event.release.tag_name }} to production
#    environment:  # It will wait for approval if we add an environment
#      name: staging
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: "${{ vars.FORGE_EMAIL }}"
      FORGE_API_TOKEN: "${{ secrets.FORGE_API_TOKEN }}"
      MIXPANEL_TOKEN: "${{ vars.VITE_MIXPANEL_TOKEN }}"
    outputs:
      license: ${{ steps.properties.outputs.license }}
    steps:
      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      # Set environment variables
      - name: Export Properties
        id: properties
        shell: bash
        run: |
          # extract variant from tag: v{TS}-{variant} (e.g. full, lite, diagramly, asyncapi)
          VARIANT=$(echo ${{ github.event.release.tag_name }} | sed 's/^v[0-9.]*-//')
          LICENSE="$VARIANT"
          {
            echo "variant=$VARIANT"
            echo "license=$LICENSE"
            # cf_project is the FULL Cloudflare Pages project name (the
            # Forge-app BACKEND host — functions/, D1/KV/R2/AI).
            # - diagramly and asyncapi both share conf-lite for now (functions
            #   are identical across variants; the Forge FRONTEND is served by
            #   Forge's CDN, not Cloudflare, so the shared Pages static deploy
            #   is backend-only). Swap to dedicated conf-diagramly /
            #   conf-asyncapi projects before GA.
            # - asyncapi must NOT publish to asyncapi-confluence-prod: that
            #   Cloudflare project is the live Connect *Worker* bound to
            #   zenapi.zenuml.com, still serving Connect-installed tenants
            #   (descriptor, lifecycle, /confluence-plugin/*viewer.html).
            #   Domain continuity for the connect remote baseUrl is preserved
            #   instead by a proxy clause IN that worker, which forwards Forge
            #   paths (/forge-*, /api/*, …) to this conf-lite backend. See
            #   AsyncAPI-Conf-V2 connect branch, src/worker.ts.
            case "$LICENSE" in
              diagramly) echo "cf_project=conf-lite" ;;
              asyncapi)  echo "cf_project=conf-lite" ;;
              *)         echo "cf_project=conf-$LICENSE" ;;
            esac
          } >> "$GITHUB_OUTPUT"
      # The asyncapi build (pnpm build:asyncapi) needs vendor/asyncapi-studio
      # checked out so scripts/build-studio.sh can rebuild Studio from source.
      # Default checkout above does NOT init submodules — we init explicitly
      # (and only for asyncapi) so the private submodule isn't attempted.
      - name: Init asyncapi-studio submodule
        if: ${{ steps.properties.outputs.license == 'asyncapi' }}
        run: git submodule update --init --depth 1 vendor/asyncapi-studio
      - name: Build and publish to Cloudflare
        uses: ./.github/actions/wrangler-publish
        with:
          node-version: '24.x'
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          license: ${{ steps.properties.outputs.license }}
          project: ${{ steps.properties.outputs.cf_project }}
          environment: prod
          vite-mixpanel-token: ${{ vars.VITE_MIXPANEL_TOKEN }}
          vite-app-version: ${{ github.event.release.tag_name }}
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          page-capture-secret: ${{ vars.PAGE_CAPTURE_SECRET }}
          page-capture-allowed-domains: ${{ vars.PAGE_CAPTURE_ALLOWED_DOMAINS_PROD }}
      # All non-asyncapi variants: strip the asyncapi-only modules so they never
      # leak into the lite/full/diagramly production apps. They live in
      # manifest.yml only so the asyncapi variant can ship them. Mirrors
      # scripts/forge-wizard.mjs (zenuml-asyncapi-* macros, async-api-doc custom
      # content, and the asyncapi-only confluence:spacePage dashboard).
      - name: Remove asyncapi modules in manifest.yml
        if: ${{ steps.properties.outputs.license != 'asyncapi' }}
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules.macro[] | select(.key | test("zenuml-asyncapi"))) | del(.modules["confluence:customContent"][] | select(.key | test("async-api-doc"))) | del(.modules["confluence:spacePage"])' -i manifest.yml
      - name: Remove contentBylineItem in manifest.yml
        if: ${{ steps.properties.outputs.license != 'diagramly' }}
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules["confluence:contentBylineItem"])' -i manifest.yml
      - name: Remove ZenUML-only globalSettings/globalPage entries from Diagramly
        if: ${{ steps.properties.outputs.license == 'diagramly' }}
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq eval '
              del(.modules."confluence:globalSettings"[] | select(.key == "zenuml-get-started-settings"))
              | del(.modules."confluence:globalPage")
            ' -i manifest.yml
      - name: Remove embed macro for Diagramly
        if: ${{ steps.properties.outputs.license == 'diagramly' }}
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules.macro[] | select(.key | test("zenuml-embed-macro")))' -i manifest.yml
      - name: Remove diagramly admin module from Lite/Full
        if: ${{ steps.properties.outputs.license != 'diagramly' }}
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq eval '
              del(.modules."confluence:globalSettings"[] | select(.key == "diagramly-admin-create-demo-page"))
              | del(.modules.function[] | select(.key == "createDemoPage"))
              | del(.modules.function[] | select(.key == "createDemoPageScheduled"))
              | del(.modules.scheduledTrigger)
            ' -i manifest.yml
      # AsyncAPI: keep only the asyncapi macros, drop the dashboard /
      # get-started / byline modules, and grant `unsafe-eval` in CSP so
      # Studio's runtime schema compilation works inside Forge's iframe.
      # Mirrors the asyncapi block in scripts/forge-wizard.mjs.
      - name: Remove non-asyncapi macros from manifest (AsyncAPI)
        if: ${{ steps.properties.outputs.license == 'asyncapi' }}
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules.macro[] | select(.key | test("zenuml-asyncapi") | not))' -i manifest.yml
      - name: Remove globalSettings + globalPage + contentBylineItem (AsyncAPI uses spacePage only)
        if: ${{ steps.properties.outputs.license == 'asyncapi' }}
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules["confluence:globalSettings"]) | del(.modules["confluence:globalPage"]) | del(.modules["confluence:contentBylineItem"])' -i manifest.yml
      - name: Remove non-asyncapi custom content types (AsyncAPI)
        if: ${{ steps.properties.outputs.license == 'asyncapi' }}
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules["confluence:customContent"][] | select(.key | test("async-api-doc") | not))' -i manifest.yml
      - name: Allow 'unsafe-eval' in CSP (AsyncAPI Studio runtime schema compilation)
        if: ${{ steps.properties.outputs.license == 'asyncapi' }}
        uses: mikefarah/yq@master
        with:
          cmd: yq eval '.permissions.content.scripts = ["unsafe-eval"]' -i manifest.yml
      - name: Remove licensing for Lite
        if: ${{ steps.properties.outputs.license == 'lite' }}
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.app.licensing)' -i manifest.yml
      - name: Upload final manifest
        uses: actions/upload-artifact@v6
        with:
          name: manifest-${{ steps.properties.outputs.license }}-prod
          path: manifest.yml
      - name: Deploy "ZenUML for Confluence" to Forge Production
        if: ${{ steps.properties.outputs.license == 'lite' }}
        run: |
          pnpm forge:deploy:disable-analytics
          pnpm exec forge variables set MIXPANEL_TOKEN "$MIXPANEL_TOKEN" -e production
          pnpm exec forge variables set BACKEND_API_BASE_URL "https://conf-lite.zenuml.com" -e production
          pnpm forge:deploy:lite:prod
      - name: Deploy "ZenUML for Confluence Full" to Forge Production
        if: ${{ steps.properties.outputs.license == 'full' }}
        run: |
          pnpm forge:deploy:disable-analytics
          APP_ID=d9e4002b-120b-426b-834b-402a4a5adce7 pnpm exec forge variables set MIXPANEL_TOKEN "$MIXPANEL_TOKEN" -e production
          APP_ID=d9e4002b-120b-426b-834b-402a4a5adce7 pnpm exec forge variables set BACKEND_API_BASE_URL "https://conf-full.zenuml.com" -e production
          pnpm forge:deploy:full:prod
      - name: Deploy "Diagramly for Confluence" to Forge Production
        if: ${{ steps.properties.outputs.license == 'diagramly' }}
        run: |
          pnpm forge:deploy:disable-analytics
          APP_ID=01ede8b1-4e88-451a-b9ef-89eeef93afaf pnpm exec forge variables set MIXPANEL_TOKEN "$MIXPANEL_TOKEN" -e production
          APP_ID=01ede8b1-4e88-451a-b9ef-89eeef93afaf pnpm exec forge variables set BACKEND_API_BASE_URL "https://conf-lite.zenuml.com" -e production
          pnpm forge:deploy:diagramly:prod
      - name: Deploy "AsyncAPI for Confluence" to Forge Production
        if: ${{ steps.properties.outputs.license == 'asyncapi' }}
        run: |
          pnpm forge:deploy:disable-analytics
          APP_ID=49017727-af19-4ab6-8d5a-7d28108936b6 pnpm exec forge variables set MIXPANEL_TOKEN "$MIXPANEL_TOKEN" -e production
          # AsyncAPI keeps zenapi.zenuml.com as the connect remote baseUrl
          # (existing installs' consented baseUrl stays unchanged). zenapi is
          # the live Connect worker, which proxies Forge backend paths to the
          # conf-lite Pages deployment built above. DEPENDENCY: that worker
          # proxy clause (AsyncAPI-Conf-V2 connect branch, src/worker.ts) must
          # ship before this release, else Forge backend calls — all telemetry/
          # sync, non-critical — 404. Core render/edit goes direct to Confluence.
          APP_ID=49017727-af19-4ab6-8d5a-7d28108936b6 pnpm exec forge variables set BACKEND_API_BASE_URL "https://zenapi.zenuml.com" -e production
          pnpm forge:deploy:asyncapi:prod
      - name: Deploy "ZenUML for Confluence Full" to Forge Production
        if: ${{ steps.properties.outputs.variant == 'full' }}
        run: |
          pnpm forge:deploy:disable-analytics
          APP_ID=d9e4002b-120b-426b-834b-402a4a5adce7 pnpm exec forge variables set MIXPANEL_TOKEN "$MIXPANEL_TOKEN" -e production
          APP_ID=d9e4002b-120b-426b-834b-402a4a5adce7 pnpm exec forge variables set BACKEND_API_BASE_URL "https://conf-full.zenuml.com" -e production
          pnpm forge:deploy:full:prod
      - name: Set PAGE_CAPTURE_SECRET in Forge Production
        if: ${{ vars.PAGE_CAPTURE_SECRET != '' }}
        run: |
          case "${{ steps.properties.outputs.license }}" in
            lite)
              pnpm exec forge variables set PAGE_CAPTURE_SECRET "$PAGE_CAPTURE_SECRET" --encrypt -e production
              ;;
            full)
              APP_ID=d9e4002b-120b-426b-834b-402a4a5adce7 pnpm exec forge variables set PAGE_CAPTURE_SECRET "$PAGE_CAPTURE_SECRET" --encrypt -e production
              ;;
            diagramly)
              APP_ID=01ede8b1-4e88-451a-b9ef-89eeef93afaf pnpm exec forge variables set PAGE_CAPTURE_SECRET "$PAGE_CAPTURE_SECRET" --encrypt -e production
              ;;
            asyncapi)
              APP_ID=49017727-af19-4ab6-8d5a-7d28108936b6 pnpm exec forge variables set PAGE_CAPTURE_SECRET "$PAGE_CAPTURE_SECRET" --encrypt -e production
              ;;
          esac
        env:
          PAGE_CAPTURE_SECRET: ${{ vars.PAGE_CAPTURE_SECRET }}

  deploy-cron-worker:
    name: Deploy Cron Worker to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v5
        with:
          version: 10.x
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter cron-aggregate
      - name: Deploy cron-aggregate to production
        working-directory: workers/cron-aggregate
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke-test:
    # AsyncAPI has no prod tenant + no `asyncapi@prod` profile in
    # tests/e2e-tests/config/apps.ts yet. Skip the prod smoke for that variant
    # until both land — wire them up alongside the conf-asyncapi Cloudflare
    # Pages project mentioned in scripts/forge-wizard.mjs.
    if: ${{ needs.release.outputs.license != 'asyncapi' }}
    needs: release
    name: Smoke Test (Prod) — ${{ needs.release.outputs.license }}
    uses: ./.github/workflows/e2e-test.yml
    with:
      app: ${{ needs.release.outputs.license == 'lite' && 'zenuml-lite@prod' || needs.release.outputs.license == 'full' && 'zenuml-full@prod' || 'diagramly@prod' }}
      suite: insert
      artifact-suffix: ${{ needs.release.outputs.license }}-prod-smoke
      username: ${{ vars.ZENUML_PROD_USERNAME }}
      password: ${{ vars.ZENUML_PROD_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}
      # Post-deploy smoke: a cold-render wedge can't pass on retry, so retries
      # just burn the shard's 8-min budget. Fail fast (with trace) instead.
      retries: '1'
