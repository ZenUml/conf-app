name: Staging E2E — staging-asyncapi-e2e
run-name: "staging-asyncapi-e2e · parent ${{ inputs.parent-run-id }} · attempt ${{ inputs.parent-attempt }} · source ${{ inputs.source-sha }}"
on:
  workflow_dispatch:
    inputs:
      parent-run-id: {type: string, required: true}
      parent-attempt: {type: string, required: true}
      source-sha: {type: string, required: true}
      root-run-id: {type: string, required: false, default: ''}
      root-attempt: {type: string, required: false, default: ''}
      suite: {type: string, default: insert}
      timeout: {type: string, default: '11'}
      grep: {type: string, default: ''}
permissions:
  contents: read
  actions: read
jobs:
  parent:
    name: Verify staging ownership
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}
      - name: Check the active parent
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ inputs.parent-run-id }}
          PARENT_ATTEMPT: ${{ inputs.parent-attempt }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          ROOT_RUN_ID: ${{ inputs.root-run-id }}
          ROOT_ATTEMPT: ${{ inputs.root-attempt }}
          EXPECTED_PARENT_JOBS: '["Validate: AsyncAPI"]'
        run: node scripts/ci/wait-for-e2e.mjs --verify-parent
  tests:
    needs: parent
    uses: ./.github/workflows/e2e-test.yml
    with:
      planned: true
      app: asyncapi@stg
      suite: asyncapi
      auth-artifact: auth-state-pre-asyncapi-stg
      source-run-id: ${{ inputs.parent-run-id }}
      source-attempt: ${{ inputs.parent-attempt }}
      ref: ${{ inputs.source-sha }}
      # Three shards for three spec files: the suite's two multi-test files are
      # `describe.configure({ mode: 'serial' })`, so `--list --shard=N/5`
      # (2026-09-11) put them on shards 1, 3 and 4 and left 2 and 5 EMPTY —
      # two runners spent on checkout + install to run nothing. Under N=3 the
      # split is create-edit (x3) / dashboard-loads / macro-create-edit (x2),
      # every shard busy, same critical path.
      shard-matrix: '[1, 2, 3]'
      artifact-suffix: asyncapi-stg
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}
