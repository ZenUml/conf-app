name: Staging Deploy

on:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
        description: 'lite, full, or diagramly'
      license:
        required: true
        type: string
        description: 'Build license passed to wrangler-publish'
      project:
        required: true
        type: string
        description: 'Cloudflare Pages project name'
      environment:
        required: true
        type: string
        description: 'GitHub environment name'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      FORGE_EMAIL: "${{ vars.FORGE_EMAIL }}"
      FORGE_API_TOKEN: "${{ secrets.FORGE_API_TOKEN }}"
    steps:
      - uses: actions/checkout@v5
      - name: Build and publish
        uses: ./.github/actions/wrangler-publish
        with:
          node-version: '24.x'
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          license: ${{ inputs.license }}
          project: ${{ inputs.project }}
          environment: stg
          vite-mixpanel-token: ${{ vars.VITE_MIXPANEL_TOKEN }}
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          page-capture-secret: ${{ vars.PAGE_CAPTURE_SECRET }}
          page-capture-allowed-domains: ${{ vars.PAGE_CAPTURE_ALLOWED_DOMAINS_STG }}

      # Lite: remove contentBylineItem and licensing
      - name: Remove contentBylineItem from manifest
        if: inputs.variant == 'lite'
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules["confluence:contentBylineItem"])' -i manifest.yml
      - name: Remove licensing (Lite is free)
        if: inputs.variant == 'lite'
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.app.licensing)' -i manifest.yml
      - name: Upload final manifest
        if: inputs.variant == 'lite'
        uses: actions/upload-artifact@v6
        with:
          name: manifest-lite-staging
          path: manifest.yml

      # Diagramly: remove dashboard and embed macro
      - name: Remove dashboard from manifest
        if: inputs.variant == 'diagramly'
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules["confluence:globalSettings"]) | del(.modules["confluence:globalPage"])' -i manifest.yml
      - name: Remove embed macro from manifest
        if: inputs.variant == 'diagramly'
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules.macro[] | select(.key | test("zenuml-embed-macro")))' -i manifest.yml

      # Forge deploy (all variants)
      # TODO(ZEN-1170-followup, 2026-05-22): The pnpm scripts at
      # forge:deploy:{lite,full,diagramly}:{staging,prod} in package.json
      # currently pass --no-verify to `forge deploy`. This was added because
      # Atlassian retired several developer.atlassian.com openapi spec URLs
      # that @forge/lint unconditionally fetches at startup (HTTP 404 size 0
      # on bitbucket/swagger.json, confluence/openapi-v2.v3.json,
      # jira/{platform,service-desk,software}/swagger.v3.json). Affects both
      # @forge/cli@12.14.0 and @forge/cli@12.20.1. Prod scripts also use
      # --no-verify (added in the follow-up after staging worked) so the
      # ZEN-1170 crash fix can ship today. Revert --no-verify on BOTH
      # staging and prod scripts when Atlassian either restores the URLs or
      # ships a CLI that doesn't fetch them. Recheck scheduled for the next
      # morning.
      - name: Deploy to Forge Staging
        env:
          MIXPANEL_TOKEN: ${{ vars.VITE_MIXPANEL_TOKEN }}
        run: |
          pnpm forge:deploy:disable-analytics
          case "${{ inputs.variant }}" in
            full)
              APP_ID=d9e4002b-120b-426b-834b-402a4a5adce7 pnpm exec forge variables set MIXPANEL_TOKEN "$MIXPANEL_TOKEN" -e staging
              APP_ID=d9e4002b-120b-426b-834b-402a4a5adce7 pnpm exec forge variables set BACKEND_API_BASE_URL "https://conf-stg-full.zenuml.com" -e staging
              ;;
            diagramly)
              APP_ID=01ede8b1-4e88-451a-b9ef-89eeef93afaf pnpm exec forge variables set MIXPANEL_TOKEN "$MIXPANEL_TOKEN" -e staging
              APP_ID=01ede8b1-4e88-451a-b9ef-89eeef93afaf pnpm exec forge variables set BACKEND_API_BASE_URL "https://conf-stg-lite.zenuml.com" -e staging
              ;;
            *)
              pnpm exec forge variables set MIXPANEL_TOKEN "$MIXPANEL_TOKEN" -e staging
              pnpm exec forge variables set BACKEND_API_BASE_URL "https://conf-stg-lite.zenuml.com" -e staging
              ;;
          esac
          pnpm forge:deploy:${{ inputs.variant }}:staging
      - name: Set PAGE_CAPTURE_SECRET in Forge Staging
        if: ${{ vars.PAGE_CAPTURE_SECRET != '' }}
        run: |
          case "${{ inputs.variant }}" in
            lite)
              pnpm exec forge variables set PAGE_CAPTURE_SECRET "$PAGE_CAPTURE_SECRET" --encrypt -e staging
              ;;
            full)
              APP_ID=d9e4002b-120b-426b-834b-402a4a5adce7 pnpm exec forge variables set PAGE_CAPTURE_SECRET "$PAGE_CAPTURE_SECRET" --encrypt -e staging
              ;;
            diagramly)
              APP_ID=01ede8b1-4e88-451a-b9ef-89eeef93afaf pnpm exec forge variables set PAGE_CAPTURE_SECRET "$PAGE_CAPTURE_SECRET" --encrypt -e staging
              ;;
          esac
        env:
          PAGE_CAPTURE_SECRET: ${{ vars.PAGE_CAPTURE_SECRET }}
      - name: Install Lite to lite-stg.atlassian.net
        if: inputs.variant == 'lite'
        run: pnpm forge:install:lite:staging || pnpm forge:upgrade:lite:staging
        continue-on-error: true
      - name: Install Full to full-stg.atlassian.net
        if: inputs.variant == 'full'
        run: pnpm forge:install:full:staging || pnpm forge:upgrade:full:staging
        continue-on-error: true
      - name: Install Diagramly to dia-stg.atlassian.net
        if: inputs.variant == 'diagramly'
        run: pnpm forge:install:diagramly:staging || pnpm forge:upgrade:diagramly:staging
        continue-on-error: true

      - name: Write deployment summary
        if: always()
        run: |
          case "${{ inputs.variant }}" in
            lite)      SITE="zenuml-stg.atlassian.net"; TYPE="Forge" ;;
            full)      SITE="full-stg.atlassian.net";   TYPE="Forge" ;;
            diagramly) SITE="dia-stg.atlassian.net";    TYPE="Forge" ;;
          esac
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Variant  | ${{ inputs.variant }} |" >> $GITHUB_STEP_SUMMARY
          echo "| App type | ${TYPE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Confluence site | ${SITE} |" >> $GITHUB_STEP_SUMMARY
