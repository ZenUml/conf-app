name: Staging Deploy

on:
  # Manual entry point so a feature branch can deploy a non-Lite variant to
  # staging without merging first. build-test-deploy.yml gates full/diagramly/
  # asyncapi staging deploys on the default branch, which left Full-only code
  # (e.g. the Lite->Full conversion executor) unverifiable pre-merge.
  workflow_dispatch:
    inputs:
      variant:
        required: true
        type: choice
        options: [lite, full, diagramly, asyncapi]
        description: 'Variant to deploy to staging from this branch'
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
        description: 'lite, full, diagramly, or asyncapi'
      license:
        required: true
        type: string
        description: 'Build license passed to wrangler-publish'
      project:
        required: true
        type: string
        description: 'Cloudflare Pages project name'
      environment:
        required: true
        type: string
        description: 'GitHub environment name'

jobs:
  # workflow_dispatch supplies only `variant`; workflow_call supplies all four.
  # This job normalises both into one set of values the deploy job consumes,
  # keeping the variant -> project/environment mapping in a single place.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      variant: ${{ steps.map.outputs.variant }}
      license: ${{ steps.map.outputs.license }}
      project: ${{ steps.map.outputs.project }}
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - id: map
        env:
          VARIANT: ${{ inputs.variant }}
          IN_LICENSE: ${{ inputs.license }}
          IN_PROJECT: ${{ inputs.project }}
          IN_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            lite)      DEF_PROJECT=conf-stg-lite ;;
            full)      DEF_PROJECT=conf-stg-full ;;
            diagramly) DEF_PROJECT=conf-stg-lite ;;
            asyncapi)  DEF_PROJECT=conf-stg-lite ;;
            *) echo "unknown variant: $VARIANT" >&2; exit 1 ;;
          esac
          {
            echo "variant=$VARIANT"
            echo "license=${IN_LICENSE:-$VARIANT}"
            echo "project=${IN_PROJECT:-$DEF_PROJECT}"
            echo "environment=${IN_ENVIRONMENT:-staging-$VARIANT}"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ needs.resolve.outputs.environment }}
    env:
      FORGE_EMAIL: "${{ vars.FORGE_EMAIL }}"
      FORGE_API_TOKEN: "${{ secrets.FORGE_API_TOKEN }}"
    steps:
      - uses: actions/checkout@v5
      # The asyncapi and lite builds (pnpm build:asyncapi / build:lite) need
      # vendor/asyncapi-studio checked out before scripts/build-studio.sh runs
      # (lite ships the AsyncAPI macro per ADR-0005). Init explicitly so
      # `actions/checkout@v5` doesn't try to clone the private submodule.
      - name: Init asyncapi-studio submodule
        if: needs.resolve.outputs.variant == 'asyncapi' || needs.resolve.outputs.variant == 'lite'
        run: git submodule update --init --depth 1 vendor/asyncapi-studio
      # Cloudflare Pages backend deploy (conf-stg-{project}) — runs before the
      # Forge-specific steps below in this same job. Named to match
      # release.yml's equivalent step so `gh run view --json jobs` step lists
      # (which collapse composite-action internals to this one line) can't be
      # misread as part of the Forge deploy that follows.
      - name: Build and publish to Cloudflare
        uses: ./.github/actions/wrangler-publish
        with:
          node-version: '24.x'
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          license: ${{ needs.resolve.outputs.license }}
          project: ${{ needs.resolve.outputs.project }}
          environment: stg
          vite-mixpanel-token: ${{ vars.VITE_MIXPANEL_TOKEN }}
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          page-capture-secret: ${{ vars.PAGE_CAPTURE_SECRET }}
          page-capture-allowed-domains: ${{ vars.PAGE_CAPTURE_ALLOWED_DOMAINS_STG }}

      # full/diagramly: strip the asyncapi-only modules. They live in
      # manifest.yml so the asyncapi variant can ship them, but must NOT leak
      # into full/diagramly. Mirrors the full/diagramly manifestEdits in
      # scripts/forge-wizard.mjs (macros zenuml-asyncapi-*, the async-api-doc
      # custom content, and the asyncapi-only confluence:spacePage dashboard).
      - name: Remove asyncapi modules from manifest
        if: needs.resolve.outputs.variant != 'asyncapi' && needs.resolve.outputs.variant != 'lite'
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules.macro[] | select(.key | test("zenuml-asyncapi"))) | del(.modules["confluence:customContent"][] | select(.key | test("async-api-doc"))) | del(.modules["confluence:spacePage"])' -i manifest.yml

      # lite: ADR-0005 Option A — keep the page-rendered AsyncAPI macro
      # (content stored under the shared zenuml-content-sequence type); strip
      # only the embed macro (references async-api-doc documents, a type Lite
      # doesn't claim), the async-api-doc custom content, and the dashboard
      # spacePage. Grant unsafe-eval for AsyncAPI Studio's runtime schema
      # compilation. Mirrors the lite manifestEdits in scripts/forge-wizard.mjs.
      - name: Remove asyncapi embed/content/dashboard from manifest, allow unsafe-eval (Lite keeps the AsyncAPI macro)
        if: needs.resolve.outputs.variant == 'lite'
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules.macro[] | select(.key == "zenuml-asyncapi-embed-macro")) | del(.modules["confluence:customContent"][] | select(.key | test("async-api-doc"))) | del(.modules["confluence:spacePage"]) | .permissions.content.scripts = ["unsafe-eval"]' -i manifest.yml

      # All non-asyncapi variants: strip the Connect lifecycle module
      # (connectModules). It lives in manifest.yml only so the asyncapi variant
      # — which still serves legacy Connect (my-api / AsyncAPI-Conf-V2) installs
      # — keeps it. lite/full/diagramly are Forge-only; the Forge
      # remote-installed-trigger covers install/upgrade lifecycle. Mirrors
      # scripts/forge-wizard.mjs.
      - name: Remove Connect lifecycle module (connectModules) from manifest
        if: needs.resolve.outputs.variant != 'asyncapi'
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.connectModules)' -i manifest.yml

      # confluence:contentBylineItem carries three entries and every variant
      # ships a different subset, so each strip is key-scoped — a blanket module
      # delete would take the activation nudge (gated by
      # displayConditions.entityPropertyExists) with it. Mirrors
      # scripts/forge-wizard.mjs and release.yml:
      #
      #   lite      → newuser + diagrams   (drops aiaide)
      #   full      → newuser              (drops aiaide + diagrams)
      #   diagramly → newuser + aiaide     (drops diagrams)
      #   asyncapi  → none                 (whole module, stripped further below)
      - name: Remove zenuml-byline-aiaide from manifest (Lite keeps newuser + diagrams)
        if: needs.resolve.outputs.variant == 'lite'
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules["confluence:contentBylineItem"][] | select(.key == "zenuml-byline-aiaide"))' -i manifest.yml
      # aiaide is Diagramly-branded; diagrams is the Lite index. Full has no
      # byline surface of its own, so only the nudge survives.
      - name: Remove zenuml-byline-aiaide and zenuml-byline-diagrams from manifest (Full keeps newuser)
        if: needs.resolve.outputs.variant == 'full'
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq eval '(.modules["confluence:contentBylineItem"][] | select(.key == "zenuml-byline-diagrams") | .displayConditions) |= {"entityPropertyEqualTo": .and.entityPropertyEqualTo} | del(.modules["confluence:contentBylineItem"][] | select(.key == "zenuml-byline-aiaide" or .key == "zenuml-byline-diagrams"))' -i manifest.yml
      - name: Remove the Lite diagrams byline entry from manifest (Diagramly keeps newuser + aiaide)
        if: needs.resolve.outputs.variant == 'diagramly'
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules["confluence:contentBylineItem"][] | select(.key == "zenuml-byline-diagrams"))' -i manifest.yml
      - name: Remove licensing (Lite is free)
        if: needs.resolve.outputs.variant == 'lite'
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.app.licensing)' -i manifest.yml

      # Full: the source manifest carries Lite's canonical matcher. CI edits
      # manifests independently of scripts/forge-wizard.mjs, so keep this
      # variant override here as well.
      - name: Point Full embed deeplink matcher at conf-full
        if: needs.resolve.outputs.variant == 'full'
        uses: mikefarah/yq@master
        with:
          cmd: yq eval '(.modules.macro[] | select(.key | test("zenuml-embed-macro")) | .autoConvert.matchers[0].pattern) = "https://conf-full.zenuml.com/d/*/*"' -i manifest.yml

      # Diagramly: remove ZenUML-only dashboard/get-started entries (keep
      # diagramly admin entry). The embed macro ships in Diagramly now (task 6
      # deeplink productization) — do NOT reintroduce a "remove embed macro"
      # step here; see the comment on diagramly's manifestEdits array in
      # scripts/forge-wizard.mjs.
      - name: Remove ZenUML-only globalSettings/globalPage entries from Diagramly manifest
        if: needs.resolve.outputs.variant == 'diagramly'
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq eval '
              del(.modules."confluence:globalSettings"[] | select(.key == "zenuml-get-started-settings"))
              | del(.modules."confluence:globalPage")
            ' -i manifest.yml
      # AsyncAPI: keep only the asyncapi macros, drop the dashboard /
      # get-started / byline modules, and grant `unsafe-eval` in CSP so
      # Studio's runtime schema compilation works inside Forge's iframe.
      # Mirrors the asyncapi block in scripts/forge-wizard.mjs.
      - name: Remove non-asyncapi macros from manifest (AsyncAPI; keep asyncapi + openapi)
        if: needs.resolve.outputs.variant == 'asyncapi'
        uses: mikefarah/yq@master
        with:
          # Keep the asyncapi macros AND the OpenAPI macro — see scripts/forge-wizard.mjs.
          cmd: yq eval 'del(.modules.macro[] | select(.key | test("zenuml-asyncapi|zenuml-openapi-macro") | not))' -i manifest.yml
      - name: Remove globalSettings + globalPage + contentBylineItem + homepageFeed (AsyncAPI uses spacePage only)
        if: needs.resolve.outputs.variant == 'asyncapi'
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules["confluence:globalSettings"]) | del(.modules["confluence:globalPage"]) | del(.modules["confluence:contentBylineItem"]) | del(.modules["confluence:homepageFeed"])' -i manifest.yml
      - name: Remove non-asyncapi custom content types (AsyncAPI)
        if: needs.resolve.outputs.variant == 'asyncapi'
        uses: mikefarah/yq@master
        with:
          cmd: yq eval 'del(.modules["confluence:customContent"][] | select(.key | test("async-api-doc") | not))' -i manifest.yml
      - name: Allow 'unsafe-eval' in CSP (AsyncAPI Studio runtime schema compilation)
        if: needs.resolve.outputs.variant == 'asyncapi'
        uses: mikefarah/yq@master
        with:
          cmd: yq eval '.permissions.content.scripts = ["unsafe-eval"]' -i manifest.yml

      # Non-Diagramly: strip only the Diagramly demo pipeline. Do not delete
      # the whole scheduledTrigger block: Lite also owns the daily macro count
      # snapshot trigger.
      - name: Remove diagramly admin module from Lite/Full manifest
        if: needs.resolve.outputs.variant != 'diagramly'
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq eval '
              del(.modules."confluence:globalSettings"[] | select(.key == "diagramly-admin-create-demo-page"))
              | del(.modules.function[] | select(.key == "createDemoPage"))
              | del(.modules.function[] | select(.key == "createDemoPageScheduled"))
              | del(.modules.scheduledTrigger[] | select(.key == "diagramly-demo-page-pipeline"))
            ' -i manifest.yml

      # The snapshot schedule ships only in Lite. The connect remote's storage
      # declaration applies to every variant because all variants mirror saved
      # diagram content to D1.
      - name: Remove Lite macro snapshot modules from non-Lite variants
        if: needs.resolve.outputs.variant != 'lite'
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq eval '
              del(.modules.function[] | select(.key == "macroCountSnapshotFn" or .key == "bylineVisibilityFn"))
              | del(.modules.scheduledTrigger[] | select(.key == "lite-macro-count-daily" or .key == "byline-visibility-hourly"))
              | del(.modules.scheduledTrigger | select(length == 0))
            ' -i manifest.yml

      # The /new/<type> and /d/<type>/*/* matchers are the byline's
      # paste-to-create links, and only Lite ships the byline that mints them.
      # In any other variant they collide with Lite's identical patterns on a
      # both-installed site, and the app-scoped custom content behind a /d/
      # link makes the wrong winner a permanently broken macro. The embed
      # macro's 3-segment matchers are untouched. Mirrors forge-wizard.mjs.
      - name: Remove byline paste-to-create matchers from non-Lite variants
        if: needs.resolve.outputs.variant != 'lite'
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq eval 'del(.modules.macro[].autoConvert.matchers[] | select(.pattern | test("zenuml[.]com/(new|d)/(sequence|mermaid|plantuml|openapi|graph|asyncapi)"))) | del(.modules.macro[] | select((.autoConvert.matchers // []) | length == 0) | .autoConvert)' -i manifest.yml

      # The Lite->Full conversion executor ships only in Full
      # (docs/superpowers/specs/2026-08-11-lite-to-full-conversion.md).
      - name: Remove Full conversion modules from non-Full variants
        if: needs.resolve.outputs.variant != 'full'
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq eval '
              del(.modules.function[] | select(.key == "liteFullConversionFn" or .key == "fullPresenceFn"))
              | del(.modules.scheduledTrigger[] | select(.key == "full-lite2full-hourly" or .key == "full-presence-daily"))
              | del(.modules.scheduledTrigger | select(length == 0))
            ' -i manifest.yml

      # Staging only: tighten the conversion trigger from hourly to 5-minute so
      # a validation job does not wait up to an hour to be claimed. Production
      # keeps `hour` (manifest default) — fiveMinute is 8,640 ticks/month per
      # install, the cadence that drove the Forge KV read overage alert on the
      # Diagramly demo pipeline.
      - name: Speed up the conversion trigger on staging
        if: needs.resolve.outputs.variant == 'full'
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq eval '
              (.modules.scheduledTrigger[] | select(.key == "full-lite2full-hourly") | .interval) = "fiveMinute"
            ' -i manifest.yml

      - name: Upload final manifest
        if: needs.resolve.outputs.variant == 'lite'
        uses: actions/upload-artifact@v6
        with:
          name: manifest-lite-staging
          path: manifest.yml

      # Workaround for an Atlassian Forge bug: `forge deploy` runs `forge lint`, which
      # fetches Atlassian swagger/OpenAPI JSON via node-fetch. On Node 22+ this
      # intermittently fails with "Invalid response body ... Premature close" (worse for
      # larger schemas), so deploys flake. The Cloudflare build above stays on Node 24;
      # pin ONLY the Forge CLI steps to Node 20 until Atlassian migrates off node-fetch.
      # https://community.developer.atlassian.com/t/forge-lint-deploy-issue-with-node-js-22/101420
      - name: Use Node 20 for Forge CLI (node-fetch "Premature close" workaround)
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      # Forge deploy (all variants)
      - name: Deploy to Forge Staging
        env:
          MIXPANEL_TOKEN: ${{ vars.VITE_MIXPANEL_TOKEN }}
        run: |
          pnpm forge:deploy:disable-analytics
          case "${{ needs.resolve.outputs.variant }}" in
            full)
              APP_ID=d9e4002b-120b-426b-834b-402a4a5adce7 pnpm exec forge variables set MIXPANEL_TOKEN "$MIXPANEL_TOKEN" -e staging
              APP_ID=d9e4002b-120b-426b-834b-402a4a5adce7 pnpm exec forge variables set BACKEND_API_BASE_URL "https://conf-stg-full.zenuml.com" -e staging
              ;;
            diagramly)
              APP_ID=01ede8b1-4e88-451a-b9ef-89eeef93afaf pnpm exec forge variables set MIXPANEL_TOKEN "$MIXPANEL_TOKEN" -e staging
              APP_ID=01ede8b1-4e88-451a-b9ef-89eeef93afaf pnpm exec forge variables set BACKEND_API_BASE_URL "https://conf-stg-lite.zenuml.com" -e staging
              ;;
            asyncapi)
              APP_ID=49017727-af19-4ab6-8d5a-7d28108936b6 pnpm exec forge variables set MIXPANEL_TOKEN "$MIXPANEL_TOKEN" -e staging
              # Asyncapi shares the lite Cloudflare Pages project for now
              # (per scripts/forge-wizard.mjs); revisit when a dedicated
              # conf-stg-asyncapi project is stood up.
              APP_ID=49017727-af19-4ab6-8d5a-7d28108936b6 pnpm exec forge variables set BACKEND_API_BASE_URL "https://conf-stg-lite.zenuml.com" -e staging
              ;;
            *)
              pnpm exec forge variables set MIXPANEL_TOKEN "$MIXPANEL_TOKEN" -e staging
              pnpm exec forge variables set BACKEND_API_BASE_URL "https://conf-stg-lite.zenuml.com" -e staging
              ;;
          esac
          pnpm forge:deploy:${{ needs.resolve.outputs.variant }}:staging
      - name: Set PAGE_CAPTURE_SECRET in Forge Staging
        if: ${{ vars.PAGE_CAPTURE_SECRET != '' }}
        run: |
          case "${{ needs.resolve.outputs.variant }}" in
            lite)
              pnpm exec forge variables set PAGE_CAPTURE_SECRET "$PAGE_CAPTURE_SECRET" --encrypt -e staging
              ;;
            full)
              APP_ID=d9e4002b-120b-426b-834b-402a4a5adce7 pnpm exec forge variables set PAGE_CAPTURE_SECRET "$PAGE_CAPTURE_SECRET" --encrypt -e staging
              ;;
            diagramly)
              APP_ID=01ede8b1-4e88-451a-b9ef-89eeef93afaf pnpm exec forge variables set PAGE_CAPTURE_SECRET "$PAGE_CAPTURE_SECRET" --encrypt -e staging
              ;;
            asyncapi)
              APP_ID=49017727-af19-4ab6-8d5a-7d28108936b6 pnpm exec forge variables set PAGE_CAPTURE_SECRET "$PAGE_CAPTURE_SECRET" --encrypt -e staging
              ;;
          esac
        env:
          PAGE_CAPTURE_SECRET: ${{ vars.PAGE_CAPTURE_SECRET }}
      - name: Install Lite to lite-stg.atlassian.net
        if: needs.resolve.outputs.variant == 'lite'
        run: pnpm forge:install:lite:staging || pnpm forge:upgrade:lite:staging
        continue-on-error: true
      - name: Install Full to full-stg.atlassian.net
        if: needs.resolve.outputs.variant == 'full'
        run: pnpm forge:install:full:staging || pnpm forge:upgrade:full:staging
        continue-on-error: true
      - name: Install Diagramly to dia-stg.atlassian.net
        if: needs.resolve.outputs.variant == 'diagramly'
        run: pnpm forge:install:diagramly:staging || pnpm forge:upgrade:diagramly:staging
        continue-on-error: true
      - name: Install AsyncAPI to asyncapi-stg.atlassian.net
        if: needs.resolve.outputs.variant == 'asyncapi'
        run: pnpm forge:install:asyncapi:staging || pnpm forge:upgrade:asyncapi:staging
        continue-on-error: true

      - name: Write deployment summary
        if: always()
        run: |
          case "${{ needs.resolve.outputs.variant }}" in
            lite)      SITE="zenuml-stg.atlassian.net";  TYPE="Forge" ;;
            full)      SITE="full-stg.atlassian.net";    TYPE="Forge" ;;
            diagramly) SITE="dia-stg.atlassian.net";     TYPE="Forge" ;;
            asyncapi)  SITE="asyncapi-stg.atlassian.net";TYPE="Forge" ;;
          esac
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Variant  | ${{ needs.resolve.outputs.variant }} |" >> $GITHUB_STEP_SUMMARY
          echo "| App type | ${TYPE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Confluence site | ${SITE} |" >> $GITHUB_STEP_SUMMARY
