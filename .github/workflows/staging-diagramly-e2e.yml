name: Staging E2E — staging-diagramly-e2e
# Called by the "Validate: <Variant>" lane of main-staging-validation.yml. It
# runs in that run, so it needs no run dispatch, no polling and no check that
# a parent run still owns staging: the run that deployed is the run that tests.
on:
  workflow_call:
    inputs:
      source-sha: {type: string, required: true}
      grep: {type: string, default: ''}
permissions:
  contents: read
  actions: read
jobs:
  parent:
    name: Verify staging backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}
      - name: Verify pinned staging backend source
        env:
          TARGET_SHA: ${{ inputs.source-sha }}
        run: node scripts/test-selection/verify-backend.mjs --sha "$TARGET_SHA" --variant diagramly --url https://conf-stg-lite.zenuml.com --sha-only
  regression:
    needs: parent
    uses: ./.github/workflows/e2e-test.yml
    with:
      planned: true
      selection-scope: main
      app: diagramly@stg
      suite: regression
      grep: ${{ inputs.grep }}
      auth-artifact: auth-state-pre-diagramly-stg
      ref: ${{ inputs.source-sha }}
      # 4 runners x 2 Playwright workers instead of up to 8 x 1: same test
      # concurrency, half the runners, so Lite's shards (the critical path)
      # are not queued behind this variant's at the free plan's 20-job cap.
      shard-matrix: '[1, 2, 3, 4]'
      workers: '2'
      timeout-minutes: 30
      artifact-suffix: diagramly-stg-regression
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  render:
    needs: parent
    uses: ./.github/workflows/e2e-test.yml
    with:
      planned: true
      selection-scope: main
      app: diagramly@stg
      suite: regression-render
      grep: ${{ inputs.grep }}
      auth-artifact: auth-state-pre-diagramly-stg
      ref: ${{ inputs.source-sha }}
      shard-matrix: '[1]'
      timeout-minutes: 25
      artifact-suffix: diagramly-stg-render
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}
