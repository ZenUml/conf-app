name: Staging E2E — staging-lite-e2e
# Called by the "Validate: <Variant>" lane of main-staging-validation.yml. It
# runs in that run, so it needs no run dispatch, no polling and no check that
# a parent run still owns staging: the run that deployed is the run that tests.
on:
  workflow_call:
    inputs:
      source-sha: {type: string, required: true}
      grep: {type: string, default: ''}
permissions:
  contents: read
  actions: read
jobs:
  regression:
    uses: ./.github/workflows/e2e-test.yml
    with:
      planned: true
      selection-scope: main
      app: zenuml-lite@stg
      suite: regression
      grep: ${{ inputs.grep }}
      auth-artifact: auth-state-pre-lite-stg
      ref: ${{ inputs.source-sha }}
      # Replaces the former standalone "Verify staging backend" job: the
      # plan job runs the same check as its first step.
      verify-backend-variant: lite
      verify-backend-url: https://conf-stg-lite.zenuml.com
      # 4 runners x 2 Playwright workers, like Full and Diagramly. At the free
      # plan's 20-job cap, 4 fewer Lite runners let AsyncAPI's shards start
      # without queueing (measured 43-53 s queue on the critical chain).
      shard-matrix: '[1, 2, 3, 4]'
      workers: '2'
      timeout-minutes: 30
      artifact-suffix: lite-stg-regression
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}

  render:
    uses: ./.github/workflows/e2e-test.yml
    with:
      planned: true
      selection-scope: main
      app: zenuml-lite@stg
      suite: regression-render
      grep: ${{ inputs.grep }}
      auth-artifact: auth-state-pre-lite-stg
      ref: ${{ inputs.source-sha }}
      # Replaces the former standalone "Verify staging backend" job: the
      # plan job runs the same check as its first step.
      verify-backend-variant: lite
      verify-backend-url: https://conf-stg-lite.zenuml.com
      shard-matrix: '[1]'
      timeout-minutes: 25
      artifact-suffix: lite-stg-render
    secrets:
      username: ${{ vars.ZENUML_STAGE_USERNAME }}
      password: ${{ vars.ZENUML_STAGE_PASSWORD }}
      otp: ${{ vars.ATLASSIAN_OTP }}
