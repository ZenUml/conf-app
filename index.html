<!DOCTYPE html>
<html lang="en">
<head>
  <title>ZenUML Forge Addon</title>

  <meta charset="utf-8">
  <script type="text/javascript" src="./js/dom-to-image.min.js?version=2022.02"></script>
  <script type="text/javascript" src="./js/md5.js"></script>

  <!-- TODO: load DrawIO scripts for Graph macro only -->
	<!-- Load common.css explicitly so we can disable viewer-static.min.js's auto-load.
	     viewer-static.min.js (mxClient section) hard-codes
	     `mxClient.link("stylesheet","mxgraph/css/common.css")` with no basePath
	     prefix; in the Forge iframe that resolves to <iframe-root>/mxgraph/css/common.css
	     → 404. Vite rewrites the leading "/" on this <link href> at build time so it
	     resolves correctly. mxLoadStylesheets=false (set below) stops the auto-load. -->
	<link rel="stylesheet" href="/drawio/mxgraph/css/common.css">
	<script type="text/javascript">
		// All globals must be set BEFORE viewer-static.min.js evaluates them.
		// viewer-static.min.js uses the `window.X = window.X || "<cdn-fallback>"` pattern,
		// so values set here take precedence over the upstream CDN defaults.
		//
		// mxLoadStylesheets=false — stops mxClient.link("stylesheet","mxgraph/css/common.css")
		// mxLoadResources=false  — stops the synchronous XHR for "./resources/graph.txt";
		//   our app intentionally skips core mx language bundles (grapheditor.properties
		//   holds everything we need via Init.js / the bundled viewer).
		// mxBasePath             — points mxgraph core to our local copy so image paths
		//   resolve correctly inside the Forge iframe.
		// uiTheme / urlParams / *_PATH — read at module-load time by Editor.js and
		//   GraphViewer.js (bare references, not window.* lookups); must exist before the
		//   bundle evaluates or those modules throw ReferenceError and the viewer goes blank.
		var mxLoadStylesheets = false;
		var mxLoadResources = false;
		window.mxBasePath = './drawio/mxgraph/';
		var uiTheme = '';
		var SHAPES_PATH = './drawio/shapes';
		var STENCIL_PATH = './drawio/stencils';
		var IMAGE_PATH = './drawio/images';
		var STYLE_PATH = './drawio/styles';
		var urlParams = (function (url) {
			var result = {};
			var idx = url.lastIndexOf('?');
			if (idx > 0) {
				var params = url.substring(idx + 1).split('&');
				for (var i = 0; i < params.length; i++) {
					var eq = params[i].indexOf('=');
					if (eq > 0) result[params[i].substring(0, eq)] = params[i].substring(eq + 1);
				}
			}
			return result;
		})(window.location.href);
	</script>
	<!-- viewer-static.min.js (DrawIO v30.0.2) is a self-contained bundle:
	     DOMPurify + mxClient + grapheditor/{Init,Graph,Shapes,Editor,EditorUi}
	     + diagramly/{Editor,GraphViewer}. Replaces the 8 individual script tags
	     used in v21.6.5 and fixes the swimlane-body fillColor rendering bug
	     (issue #143) that was present in v21.6.5. -->
	<script type="text/javascript" src="/drawio/js/viewer-static.min.js"></script>
	<!-- Pre-load shape JS files. mxStencilRegistry.getStencil() falls back to
	     loading these via XHR + eval(), which the Forge CSP blocks
	     ("'unsafe-eval' is not an allowed source of script"). Loading them via
	     <script> tags side-steps the CSP eval restriction. Each file calls
	     mxCellRenderer.registerShape() at evaluation time, so shapes like
	     mxgraph.aws4.resourceIcon (defined only in JS, not XML) become
	     resolvable. mxBasic is required first because mxBootstrap, mxBpmn,
	     etc. extend mxShapeBasic. -->
	<script type="text/javascript" src="/drawio/shapes/mxBasic.js"></script>
	<script type="text/javascript" src="/drawio/shapes/mxAWS3D.js"></script>
	<script type="text/javascript" src="/drawio/shapes/mxAWS4.js"></script>
	<script type="text/javascript">
		// SHAPES_PATH / STENCIL_PATH / IMAGE_PATH / STYLE_PATH / urlParams are
		// defined in the globals block above, before viewer-static.min.js loads.
		// This block only configures the stencil registry after the bundle has run.

		// Forge CSP forbids "unsafe-eval", which breaks mxStencilRegistry's
		// fallback path that loads shape .js files via XHR + eval(). Disable that
		// path so we don't litter the console with caught EvalErrors. The XML
		// stencils continue to load lazily via mxUtils.load (XHR, no eval), and
		// shape .js files that need to be available are pre-loaded as <script>
		// tags above.
		if (typeof mxStencilRegistry !== 'undefined') {
			mxStencilRegistry.allowEval = false;
		}

		// Register stencil libraries so mxStencilRegistry.getStencil() can resolve
		// shapes like `shape=mxgraph.aws3.lambda` in the viewer. Each entry maps a
		// "basename" (the second segment of the shape name — see
		// mxStencilRegistry.getBasenameForStencil in Graph.js) to the JS shape
		// definitions and/or XML stencils that back it. Files are fetched lazily
		// on first use so this adds no upfront cost.
		//
		// The mapping mirrors DrawIO's own diagramly/Editor.js stencil-library
		// map (now bundled inside viewer-static.min.js). The aws3 entry is added
		// on top of the official list to keep legacy AWS-2017 diagrams
		// (mxgraph.aws3.*) rendering correctly.
		(function () {
			if (typeof mxStencilRegistry === 'undefined') return;
			var L = mxStencilRegistry.libraries;
			L['arrows2'] = [SHAPES_PATH + '/mxArrows.js'];
			L['atlassian'] = [STENCIL_PATH + '/atlassian.xml', SHAPES_PATH + '/mxAtlassian.js'];
			L['bpmn'] = [SHAPES_PATH + '/mxBasic.js', STENCIL_PATH + '/bpmn.xml', SHAPES_PATH + '/bpmn/mxBpmnShape2.js'];
			L['bpmn2'] = [SHAPES_PATH + '/mxBasic.js', STENCIL_PATH + '/bpmn.xml', SHAPES_PATH + '/bpmn/mxBpmnShape2.js'];
			L['c4'] = [SHAPES_PATH + '/mxC4.js'];
			L['cisco19'] = [SHAPES_PATH + '/mxCisco19.js', STENCIL_PATH + '/cisco19.xml'];
			L['dfd'] = [SHAPES_PATH + '/mxDFD.js'];
			L['er'] = [SHAPES_PATH + '/er/mxER.js'];
			L['kubernetes'] = [SHAPES_PATH + '/mxKubernetes.js', STENCIL_PATH + '/kubernetes.xml'];
			L['flowchart'] = [SHAPES_PATH + '/mxFlowchart.js', STENCIL_PATH + '/flowchart.xml'];
			L['lean_mapping'] = [SHAPES_PATH + '/mxLeanMap.js', STENCIL_PATH + '/lean_mapping.xml'];
			L['basic'] = [SHAPES_PATH + '/mxBasic.js', STENCIL_PATH + '/basic.xml'];
			L['floorplan'] = [SHAPES_PATH + '/mxFloorplan.js', STENCIL_PATH + '/floorplan.xml'];
			L['bootstrap'] = [SHAPES_PATH + '/mxBootstrap.js', SHAPES_PATH + '/mxBasic.js', STENCIL_PATH + '/bootstrap.xml'];
			L['gmdl'] = [SHAPES_PATH + '/mxGmdl.js', STENCIL_PATH + '/gmdl.xml'];
			L['gcp2'] = [SHAPES_PATH + '/mxGCP2.js', STENCIL_PATH + '/gcp2.xml'];
			L['ibm'] = [SHAPES_PATH + '/mxIBM.js', STENCIL_PATH + '/ibm.xml'];
			L['cabinets'] = [SHAPES_PATH + '/mxCabinets.js', STENCIL_PATH + '/cabinets.xml'];
			L['archimate'] = [SHAPES_PATH + '/mxArchiMate.js'];
			L['archimate3'] = [SHAPES_PATH + '/mxArchiMate3.js'];
			L['sysml'] = [SHAPES_PATH + '/mxSysML.js'];
			L['eip'] = [SHAPES_PATH + '/mxEip.js', STENCIL_PATH + '/eip.xml'];
			L['networks'] = [SHAPES_PATH + '/mxNetworks.js', STENCIL_PATH + '/networks.xml'];
			L['aws3'] = [STENCIL_PATH + '/aws3.xml']; // legacy AWS-2017 stencils — not in upstream Editor.js
			L['aws3d'] = [SHAPES_PATH + '/mxAWS3D.js', STENCIL_PATH + '/aws3d.xml'];
			L['aws4'] = [SHAPES_PATH + '/mxAWS4.js', STENCIL_PATH + '/aws4.xml'];
			L['aws4b'] = [SHAPES_PATH + '/mxAWS4.js', STENCIL_PATH + '/aws4.xml'];
			L['android'] = [SHAPES_PATH + '/mxAndroid.js', STENCIL_PATH + '/android/android.xml'];
			L['ios'] = [SHAPES_PATH + '/mockup/mxMockupiOS.js'];
			L['ios7icons'] = [STENCIL_PATH + '/ios7/icons.xml'];
			L['ios7ui'] = [SHAPES_PATH + '/ios7/mxIOS7Ui.js', STENCIL_PATH + '/ios7/misc.xml'];
			L['infographic'] = [SHAPES_PATH + '/mxInfographic.js'];
			L['rackGeneral'] = [SHAPES_PATH + '/rack/mxRack.js', STENCIL_PATH + '/rack/general.xml'];
			L['rackF5'] = [STENCIL_PATH + '/rack/f5.xml'];
		})();

	</script>

  <style>
    *::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    *::-webkit-scrollbar-thumb {
      background-color: #D0D5DD;
      border-radius: 6px;
    }

    *::-webkit-scrollbar-track {
      background-color: #fff;
    }
  </style>
</head>
<body>
<div class="mx-auto" style="width: 100%">
  <div id="app"></div>
</div>
</body>
<script type="module" src="src/forgeIndex.ts"></script>

</html>
