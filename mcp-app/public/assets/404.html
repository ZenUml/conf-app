<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Not found</title>
  </head>
  <body>
    <!-- Served by Cloudflare Pages, with status 404, for any missing file under
         /mcp-app/assets/: Pages answers a miss with the nearest 404.html up the
         directory tree, and only falls back to the SPA's index.html (with a
         200) when there is none. Without this file a stale or mistyped asset
         URL got the SPA, with a 200 and the assets' one-year immutable cache
         header (#1038). Nothing else in dist/ has a 404.html, so the rest of
         the site keeps its SPA fallback. -->
    <p>Not found.</p>
  </body>
</html>
