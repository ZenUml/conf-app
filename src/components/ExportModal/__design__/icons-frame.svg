<svg width="1400" height="1660" viewBox="0 0 1400 1660" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Toolbar glyphs extracted from the Figma frame
    "03 - Icons revised per DESIGN.md" (file: ZenUML · Export canvas · Shottr layout).

    This is a subset of that frame's SVG export: the icon <path> elements only, with
    their `d` data and stroke attributes byte-identical to the export and left in the
    frame's own coordinate space. The frame's background grid, labels and chrome are
    dropped — they carry no geometry we implement.

    src/components/ExportModal/adsIcons.ts must quote these `d` strings verbatim;
    AdsIcon.spec.ts fails if it stops doing so. To change an icon, re-export the frame
    and paste over the `d` here, then over the one in adsIcons.ts. Never hand-edit
    coordinates in either file — see the figma-vector-extract skill.

    Two glyphs (select, stamp) are drawn in the export as overlays on top of an earlier
    draft glyph at the same slot; the overlay is the real icon and is what appears here.
  -->

  <!-- Close export -->
  <path d="M84 112L92 104M84 104L92 112" stroke="#6B7280" stroke-linecap="round" stroke-linejoin="round"/>

