<!DOCTYPE html>
<html lang="en">
<head>
  <title>Local Test Viewer</title>
  <meta charset="utf-8">
  <script type="text/javascript" src="js/util.js"></script>
  <!-- No Atlassian Connect script needed — MockAp is used automatically in local dev -->
  <!-- Force display mode so the Viewer header (Fullscreen/Edit buttons) is visible.
       Default sandbox=seq-view so the standalone context (src/sandbox/presets.ts)
       resolves a real customContentId instead of leaving forgeContext empty. -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var changed = false;
      if (!params.has('outputType')) { params.set('outputType', 'display'); changed = true; }
      if (!params.has('sandbox')) { params.set('sandbox', 'seq-view'); changed = true; }
      if (changed) {
        window.location.replace(window.location.pathname + '?' + params.toString());
      }
    })();
  </script>
  <style>
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-thumb { background-color: #D0D5DD; border-radius: 6px; }
    *::-webkit-scrollbar-track { background-color: #fff; }
  </style>
</head>
<body style="overflow: clip">
<div class="mx-auto" style="width: 100%">
  <div id="app"></div>
</div>
</body>
<script type="module" src="src/test-viewer.ts"></script>
</html>
