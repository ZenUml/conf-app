# Instruction page for ZenUML embed deeplinks (confluence.zenuml.com).
#
# Inside Confluence the deeplink is intercepted by the manifest autoConvert
# matcher and becomes an Embed macro — this Worker never sees it. It serves the
# page people hit when the link escapes Confluence (Slack, email, address bar).
#
# Deploy:
#   pnpm --filter confluence-deeplink deploy:preview   # *.workers.dev, no DNS change
#   pnpm --filter confluence-deeplink deploy:prod      # binds confluence.zenuml.com (creates the DNS record)
#
# PRIVACY: /d/* paths identify customer sites (cloudId/contentId). Keep
# observability and logpush OFF. Request counts come from the Cloudflare
# dashboard's built-in Worker metrics, which store no URLs.

name = "confluence-deeplink"
main = "src/index.ts"
compatibility_date = "2026-07-01"
account_id = "8d5fc7ce04adc5096f52485cce7d7b3d"

[observability]
enabled = false

# Production: custom domain on the zenuml.com zone. `custom_domain = true`
# makes `wrangler deploy` create/own the DNS record — that deploy is the
# cloud change that needs explicit approval.
[env.production]
name = "confluence-deeplink"
routes = [
  { pattern = "confluence.zenuml.com", custom_domain = true },
]

[env.production.observability]
enabled = false
