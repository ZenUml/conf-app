compatibility_flags = [ "nodejs_compat" ]
compatibility_date = "2024-11-11"

name="conf-prod"
pages_build_output_dir = "dist"

[vars]
DIAGRAMLY_BACKEND_API_BASE_URL = "https://diagramly.ai"
EXPECTED_FORGE_ENVIRONMENT_TYPE = "PRODUCTION"
# PAGE_CAPTURE_ALLOWED_DOMAINS is injected into [vars] at deploy time by wrangler-publish
# Source value: GitHub Actions var PAGE_CAPTURE_ALLOWED_DOMAINS_PROD

[env.production.vars]
ENVIRONMENT = "production"
DIAGRAMLY_BACKEND_API_BASE_URL = "https://diagramly.ai"
ALLOWED_FORGE_APP_IDS = "8ad26115-211f-4216-971b-0540f606303d,d9e4002b-120b-426b-834b-402a4a5adce7,01ede8b1-4e88-451a-b9ef-89eeef93afaf,49017727-af19-4ab6-8d5a-7d28108936b6" # ZenUML Lite, Full, Diagramly and AsyncAPI
EXPECTED_FORGE_ENVIRONMENT_TYPE = "PRODUCTION"
# PAGE_CAPTURE_ALLOWED_DOMAINS is injected into [vars] at deploy time by wrangler-publish
# Source value: GitHub Actions var PAGE_CAPTURE_ALLOWED_DOMAINS_PROD

[[ env.production.d1_databases ]]
binding = "DB"
database_name = "conf-zenuml-prod"
database_id = "2e34f32e-5ddd-40dc-9e3d-019f9b1d431f"
migrations_dir = "functions/migrations"

[[ env.production.kv_namespaces ]]
binding = "CLIENT_INSTALLATION_KV"
id = "ae1a9199a02e4f75b1cad07f0016aae0"

[[ env.production.r2_buckets ]]
binding = "EVENT_BUCKET"
bucket_name = "atlassian-events"

# Dedicated snapshot bucket: the shared EVENT_BUCKET expires every object after
# 7 days, which cannot satisfy the 90-day macro-count diagnostic history.
[[ env.production.r2_buckets ]]
binding = "MACRO_COUNT_SNAPSHOT_BUCKET"
bucket_name = "conf-macro-count-snapshots-prod"

[[env.production.kv_namespaces]]
binding = "confluence_plugin_features"
id = "9531a58d3f5b47a6af77750240c09548"

[[env.production.kv_namespaces]]
binding = "SPACE_LICENSE_KV"
id = "8969e8528105403bb2d9adca9fc16567"

# Live Agent Link relay's Durable Object. Pages cannot host a DO class
# internally, so this cross-Worker binding points at the standalone
# `conf-agent-link-prod` Worker (workers/agent-link/) that actually defines
# AgentLinkSession. See functions/agent-link/AgentLinkSession.ts's file
# header and functions/agent-link/channel.ts's TODO(agent-link).
# DISABLED until the companion Worker is actually deployed: `wrangler pages deploy`
# fails validating a script_name binding to a Worker that does not exist yet.
# Re-enable once workers/agent-link/ is deployed via CI (a Worker-deploy step
# ordered BEFORE this Pages publish). channel.ts 501s gracefully meanwhile.
# [[env.production.durable_objects.bindings]]
# name = "AGENT_LINK"
# class_name = "AgentLinkSession"
# script_name = "conf-agent-link-prod"

# Portal feature flags KV (production)
[[env.production.kv_namespaces]]
binding = "KV_FEATURE_FLAGS"
id = "fe9042cb20994651b0a2ef9e68f9037c"

[env.production.ai]
binding = "AI"
